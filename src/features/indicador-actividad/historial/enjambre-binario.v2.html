<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes OS · Enjambre Binario — indicador de actividad</title>
<style>
  :root{
    --bg:#0E0E12; --panel:#141318; --panel-2:#17161d; --line:#26262e;
    --ink:#E7E5F0; --mut:#8b8b96; --code:#AFA9EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 120% at 50% 20%,#16151c 0%,var(--bg) 60%,#08080b 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:'Space Grotesk',system-ui,sans-serif;padding:28px;color:var(--ink);}
  .panel{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.8);}
  .hdr{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;gap:12px;}
  .code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
    color:var(--code);background:rgba(124,58,237,.12);padding:3px 7px;border-radius:6px;margin-right:10px;}
  .lbl{font-size:14px;font-weight:600;}
  .sub{font-size:10.5px;color:var(--mut);font-family:'JetBrains Mono',monospace;text-align:right;}
  canvas{display:block;width:100%;background:transparent;}
  .controls{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .row .cap{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);
    font-family:'JetBrains Mono',monospace;width:100%;margin-bottom:2px;}
  button{font-size:12px;padding:6px 11px;background:var(--panel-2);border:1px solid #34343e;
    border-radius:8px;color:#c9c9d1;cursor:pointer;font-family:inherit;transition:.15s;}
  button:hover{border-color:#4a4a56;}
  button.on{border-color:#7C3AED;color:#DED9FA;background:rgba(124,58,237,.16);}
  button:focus-visible{outline:2px solid #7C3AED;outline-offset:2px;}
  .note{font-size:10.5px;color:#66666e;font-family:'JetBrains Mono',monospace;text-align:center;
    max-width:600px;margin:0;line-height:1.5;}
</style>
</head>
<body>
<div class="panel">
  <div class="hdr">
    <div style="display:flex;align-items:center;">
      <span class="code" id="code">AGT-HERMES-07</span>
      <span class="lbl" id="lbl">Pensando</span>
    </div>
    <span class="sub" id="sub">esperando telemetria de la cola</span>
  </div>
  <canvas id="cv" width="600" height="280"></canvas>
</div>

<div class="controls">
  <div class="row" id="states">
    <span class="cap">Estado del agente</span>
    <button data-s="pensar" class="on">Pensando</button>
    <button data-s="leer">Leyendo</button>
    <button data-s="recolectar">Recolectando</button>
    <button data-s="escribir">Escribiendo</button>
    <button data-s="construir">Construyendo</button>
    <button data-s="limpiar">Limpiando</button>
    <button data-s="negociar">Negociando A2A</button>
    <button data-s="esperar">Esperando gate</button>
    <button data-s="bloqueado">Bloqueado</button>
    <button data-s="confirmado">Confirmado</button>
  </div>
  <div class="row" id="progress">
    <span class="cap">Verificacion de progreso</span>
    <button data-p="cycle" class="on">Ciclo</button>
    <button data-p="bar">Barra</button>
    <button data-p="pct">%</button>
    <button data-p="counter">Contador</button>
    <button data-p="off">Off</button>
    <button id="auto" data-auto="1" style="margin-left:auto;">⏸ Auto</button>
  </div>
</div>
<p class="note">// los bits SON los datos: se ordenan cuando el agente los ordena. cada tanto se
transforman en una verificacion explicita (barra / % / contador). autoplay, sin telemetria = orbitan en neutro.</p>

<script>
"use strict";
// ── PALETTE (cambia aqui para otra identidad, p. ej. cian) ──────────────
const C = {
  base:'#7C3AED', hot:'#EC4899', alt:'#38BDF8',
  ok:'#34D399', bad:'#F87171', warn:'#FBBF24', dim:'#5b5570'
};
const GLITCH = '#%?!§~¬';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 600, H = 280, CX = W/2, CY = 118;        // swarm centrado en la mitad superior
const STRIP_Y = 236;                                // franja de progreso
const N = 190;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let t = 0, state = 'pensar', progMode = 'cycle', auto = true;
let prog = 0.12, autoTimer = 0, cycleTimer = 0, cycleIdx = 0;
const CYCLE_MODES = ['bar','pct','counter'];
const ORDER = ['pensar','leer','recolectar','escribir','construir','limpiar','negociar','esperar','bloqueado','confirmado'];

// particulas: posicion viva (x,y) + caracter + reloj de parpadeo
const parts = [];
for (let i=0;i<N;i++) parts.push({
  x:Math.random()*W, y:Math.random()*(STRIP_Y-10), c:Math.random()<.5?'0':'1',
  f:(Math.random()*160)|0, s:.06+Math.random()*.06                 // s = velocidad de easing (profundidad)
});

// ── helpers de forma ────────────────────────────────────────────────────
const grid = (i,cols,cw,ch,ox,oy)=>({x:ox+(i%cols)*cw, y:oy+((i/cols)|0)*ch});

// slots precomputados: dan formas DISTINTAS a escribir (texto irregular) y construir (skyline de bloques)
const WRITE_SLOTS = [];   // parrafo left-aligned con borde derecho dentado
(()=>{ const lens=[30,26,29,18,27,21,24,12], ox=CX-108, oy=CY-54, cw=7, ch=15;
  for(let r=0;r<lens.length;r++) for(let c=0;c<lens[r];c++) WRITE_SLOTS.push({x:ox+c*cw, y:oy+r*ch}); })();
const BUILD_SLOTS = [];   // torres de bloques (skyline) que se levantan capa por capa desde la base
(()=>{ const towers=[3,5,4,6,5,7,4,6,3], bw=3, cw=6, gapx=2, ch=13, baseY=CY+64, maxH=7;
  const totalW=towers.length*(bw+gapx)*cw - gapx*cw, ox=CX-totalW/2;
  for(let layer=0;layer<maxH;layer++) for(let ti=0;ti<towers.length;ti++){ if(layer<towers[ti]){
    const bx=ox+ti*(bw+gapx)*cw; for(let k=0;k<bw;k++) BUILD_SLOTS.push({x:bx+k*cw, y:baseY-layer*ch}); } } })();

// ── TARGETS por estado: (i,tt) -> {x,y,col,a,dirty?} ─────────────────────
const T = {
  pensar(i,tt){                                          // ACTIVO: nube que respira y converge/diverge (no orbita = no spinner)
    const breath=.5+.5*Math.sin(tt*.045);                // ciclo ~2.3s, contemplativo
    const ang=i*2.399+Math.sin(tt*.02+i)*.8;             // angulo aureo + wander organico (distribucion no uniforme)
    const rad=(38+(i%5)*14)*(.55+breath*.85);            // el radio respira (converge/diverge)
    const spark=Math.sin(i*7.3+tt*.06)>.985;             // chispa ocasional = una idea que asoma
    return {x:CX+Math.cos(ang)*rad*1.5, y:CY+Math.sin(ang)*rad*.8, col:spark?C.hot:C.base, a:.45+.3*breath}; },

  leer(i,tt){ const cols=34, g=grid(i,cols,7,15,CX-cols*3.5,CY-52);
    const scan=CX-cols*3.5+((tt*2.2)%(cols*7)); const hot=Math.abs(g.x-scan)<11;
    return {x:g.x, y:g.y, col:hot?C.hot:C.base, a:hot?1:.7}; },

  recolectar(i,tt){ if(i<N*.42){ const a=i/(N*.42)*6.283+tt*.01;
      return {x:CX+Math.cos(a)*220, y:CY+Math.sin(a)*92, col:C.hot, a:.9}; }
    const k=i-((N*.42)|0), g=grid(k,10,13,13,CX-64,CY-46); return {x:g.x,y:g.y,col:C.base,a:1}; },

  escribir(i,tt){ const S=WRITE_SLOTS, cur=(tt*1.7)%(S.length+46);     // texto que se teclea linea por linea
    if(i<S.length && i<cur){ const head=i>=cur-1.6;                     // el head = cursor en magenta
      return {x:S[i].x, y:S[i].y, col:head?C.hot:C.base, a:head?1:.85}; }
    return {x:CX+Math.sin(i*12.9+tt*.02)*140, y:CY-98, col:C.base, a:.26}; },   // aun no escritas, flotan tenues

  construir(i,tt){ const S=BUILD_SLOTS, built=(tt*.6)%(S.length+64);   // torres que se ensamblan capa por capa
    if(i<S.length && i<built){ const fresh=i>=built-4;                 // frente de obra "soldando" en magenta
      return {x:S[i].x, y:S[i].y, col:fresh?C.hot:C.base, a:1}; }
    const side=i%2?1:-1;                                               // piezas por colocar entran desde los lados
    return {x:CX+side*(150+Math.sin(i*3.1+tt*.05)*40), y:CY-70+Math.cos(i*2.3+tt*.04)*34, col:C.base, a:.5}; },

  limpiar(i,tt){ const sweep=((tt*1.7)%(W+80))-40;
    const hx=40+(i*97)%(W-80), hy=30+(i*61)%(STRIP_Y-70);
    if(hx<sweep){ const k=i%96, g=grid(k,16,17,13,CX-136,CY+34); return {x:g.x,y:g.y,col:C.ok,a:1}; }
    return {x:hx,y:hy,col:C.bad,a:.72,dirty:true}; },

  negociar(i,tt){ const L=i%2===0, hub={x:CX+(L?-118:118),y:CY}, col=L?C.base:C.alt;
    if(i%8===0){ const ph=((tt*.9+i*30)%180)/180, e=ph<.5?2*ph*ph:1-((-2*ph+2)**2)/2;
      const from=L?{x:CX-118,y:CY}:{x:CX+118,y:CY}, to=L?{x:CX+118,y:CY}:{x:CX-118,y:CY};
      return {x:from.x+(to.x-from.x)*e, y:from.y-Math.sin(ph*Math.PI)*40, col:C.hot, a:1}; }
    const a=i/N*6.283+tt*.01; return {x:hub.x+Math.cos(a)*40, y:hub.y+Math.sin(a)*40, col, a:.8}; },

  esperar(i,tt){                                         // PASIVO: formacion ambar quieta; solo respira la opacidad
    const a=i/N*6.283, rad=66;                           // radio FIJO (no pulsa = no "trabajando")
    const drift=Math.sin(tt*.012+i)*1.2;                 // deriva minima, polvo suspendido, sin direccion neta
    const breath=.5+.5*Math.sin(tt*.03);                 // respiracion de OPACIDAD ~3.5s (calma)
    return {x:CX+Math.cos(a)*rad*1.55+drift, y:CY+Math.sin(a)*rad*.72+drift, col:C.warn, a:.24+.34*breath}; },

  bloqueado(i,tt){ const p=(i/N), d=p<.5? p/.5 : (p-.5)/.5, s=p<.5?1:-1;   // dos diagonales = X
    const jx=(Math.random()-.5)*2.2, jy=(Math.random()-.5)*2.2;
    return {x:CX-66+d*132+jx, y:CY-52+(p<.5?d:1-d)*104*1+jy, col:C.bad, a:.9}; },

  confirmado(i,tt){ const p=i/N; let x,y;                                 // checkmark
    if(p<.4){ x=CX-58+p/.4*40; y=CY-4+p/.4*38; } else { x=CX-18+(p-.4)/.6*80; y=CY+34-(p-.4)/.6*70; }
    return {x:x+(i%3-1)*3, y:y+(((i/3)|0)%3-1)*3, col:C.ok, a:1}; }
};

const LABEL = {
  pensar:['Pensando','esperando telemetria de la cola'],
  leer:['Leyendo documentos','BUSINESS_LOGIC.md · pag 4'],
  recolectar:['Recolectando informacion','grafo-a2a · 3 de 7 fuentes'],
  escribir:['Escribiendo entregable','PRP-cliente.md · redactando'],
  construir:['Construyendo','ensamblando 5 modulos'],
  limpiar:['Limpiando datos','purgando corrupcion'],
  negociar:['Negociando A2A','ejecutor ⇄ supervisor'],
  esperar:['Esperando gate','revision humana pendiente'],
  bloqueado:['Bloqueado','dependencia sin resolver'],
  confirmado:['Confirmado on-chain','txHash 0x7f3a…c21e ✓']
};

// ── franja de progreso: los bits se vuelven verificacion explicita ───────
function drawStrip(){
  const mode = progMode==='cycle' ? CYCLE_MODES[cycleIdx] : progMode;
  if(mode==='off') return;
  ctx.save();
  ctx.font='11px "JetBrains Mono",monospace'; ctx.textBaseline='middle';
  const cy = STRIP_Y+14;
  if(mode==='bar'){
    const slots=42, x0=CX-slots*6.2/2, filled=Math.round(prog*slots);
    ctx.textAlign='center';
    for(let k=0;k<slots;k++){ const on=k<filled;
      ctx.globalAlpha=on?1:.25; ctx.fillStyle=on?C.base:C.dim;
      ctx.fillText(on?(k%2?'1':'0'):'0', x0+k*6.2+3, cy); }
    ctx.globalAlpha=1; ctx.fillStyle=C.hot; ctx.textAlign='left';
    ctx.fillText(Math.round(prog*100)+'%', x0+slots*6.2+10, cy);
  } else if(mode==='pct'){
    ctx.textAlign='center'; ctx.fillStyle=C.base; ctx.font='700 26px "Space Grotesk",sans-serif';
    ctx.fillText(Math.round(prog*100)+'%', CX, cy);
    ctx.font='10px "JetBrains Mono",monospace'; ctx.fillStyle='#77737f';
    ctx.fillText('verificado', CX, cy+20);
  } else if(mode==='counter'){
    const total=7, n=Math.round(prog*total);
    ctx.textAlign='center'; ctx.font='700 20px "JetBrains Mono",monospace'; ctx.fillStyle=C.base;
    ctx.fillText(n+' / '+total, CX, cy);
    ctx.font='10px "JetBrains Mono",monospace'; ctx.fillStyle='#77737f';
    ctx.fillText('verificaciones', CX, cy+18);
  }
  ctx.restore();
}

// ── loop (SIEMPRE corre; no depende de ningun SIM) ───────────────────────
function frame(){
  t++;
  // demo: avance de progreso + auto-cambio de estado + ciclo de verificacion
  prog += .0016; if(prog>1) prog=0;
  if(auto){ if(++autoTimer>230){ autoTimer=0; setState(ORDER[(ORDER.indexOf(state)+1)%ORDER.length], false); } }
  if(progMode==='cycle' && ++cycleTimer>150){ cycleTimer=0; cycleIdx=(cycleIdx+1)%CYCLE_MODES.length; }

  ctx.clearRect(0,0,W,H);
  ctx.font='11px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const fn = T[state];
  for(let i=0;i<N;i++){
    const p=parts[i], g=fn(i,t);
    p.x += (g.x-p.x)*p.s; p.y += (g.y-p.y)*p.s;
    if(--p.f<0){ p.f=40+(Math.random()*150|0);
      p.c = g.dirty ? GLITCH[(Math.random()*GLITCH.length)|0] : (Math.random()<.5?'0':'1'); }
    if(g.dirty && '01'.includes(p.c)) p.c=GLITCH[(Math.random()*GLITCH.length)|0];
    if(!g.dirty && !'01'.includes(p.c)) p.c=Math.random()<.5?'0':'1';
    const jx=(g.dirty&&!reduce)?(Math.random()-.5)*2.4:0, jy=(g.dirty&&!reduce)?(Math.random()-.5)*2.4:0;
    const bright = g.a>.85;
    ctx.globalAlpha = g.a*(reduce?.9:(.78+.22*Math.sin(t*.05+i)));
    ctx.shadowBlur = bright?8:0; ctx.shadowColor = bright?g.col:'transparent';
    ctx.fillStyle = g.col; ctx.fillText(p.c, p.x+jx, p.y+jy);
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;

  // linea de barrido en "limpiar"
  if(state==='limpiar'){ const sx=((t*1.7)%(W+80))-40;
    if(sx>0&&sx<W){ ctx.strokeStyle='rgba(236,72,153,.55)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(sx,22); ctx.lineTo(sx,STRIP_Y-16); ctx.stroke();
      ctx.fillStyle='rgba(236,72,153,.07)'; ctx.fillRect(sx-16,22,16,STRIP_Y-38); } }

  drawStrip();
  requestAnimationFrame(frame);   // autoplay SIEMPRE (reduced-motion solo calma, no congela)
}

// ── estado + UI ──────────────────────────────────────────────────────────
function setState(s, manual){
  state=s;
  document.querySelectorAll('#states button').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
  document.getElementById('lbl').textContent = LABEL[s][0];
  document.getElementById('sub').textContent = LABEL[s][1];
  if(manual){ auto=false; document.getElementById('auto').textContent='▶ Auto'; document.getElementById('auto').classList.remove('on'); }
}
document.getElementById('states').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(b) setState(b.dataset.s, true);
});
document.getElementById('progress').addEventListener('click', e=>{
  const b=e.target.closest('button[data-p]'); if(!b) return;
  progMode=b.dataset.p; cycleTimer=0; cycleIdx=0;
  document.querySelectorAll('#progress button[data-p]').forEach(o=>o.classList.toggle('on', o===b));
});
document.getElementById('auto').addEventListener('click', function(){
  auto=!auto; this.textContent=(auto?'⏸':'▶')+' Auto'; this.classList.toggle('on', auto);
});
document.getElementById('auto').classList.add('on');

setState('pensar', false);
requestAnimationFrame(frame);        // autoplay SIEMPRE, sin importar reduced-motion
</script>
</body>
</html>
