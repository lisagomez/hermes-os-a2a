<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes OS · Enjambre Binario — prototipo</title>
<style>
  body{margin:0;background:#121214;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:'Space Grotesk',system-ui,sans-serif;padding:24px;box-sizing:border-box;}
  .panel{width:100%;max-width:560px;background:#141318;border:1px solid #2c2c34;border-radius:14px;overflow:hidden;}
  .hdr{padding:10px 14px;border-bottom:1px solid #26262e;display:flex;align-items:center;justify-content:space-between;}
  .code{font-family:'JetBrains Mono',monospace;font-size:11px;color:#AFA9EC;margin-right:8px;}
  .lbl{font-size:13px;font-weight:500;color:#E5E7EB;}
  .sub{font-size:10.5px;color:#9a9aa3;font-family:'JetBrains Mono',monospace;}
  canvas{display:block;width:100%;}
  .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  button{font-size:12px;padding:6px 11px;background:transparent;border:1px solid #3a3a42;border-radius:8px;color:#c9c9d1;cursor:pointer;font-family:inherit;}
  button.on{border-color:#7C3AED;color:#CECBF6;}
  .note{font-size:10.5px;color:#6a6a72;font-family:'JetBrains Mono',monospace;text-align:center;margin:0;}
</style>
</head>
<body>
<div class="panel">
  <div class="hdr">
    <div style="display:flex;align-items:center;">
      <span class="code">LEG-014</span>
      <span class="lbl" id="lbl">Recolectando información</span>
    </div>
    <span class="sub" id="sub">grafo-a2a · 3 de 7 fuentes</span>
  </div>
  <canvas id="cv" width="560" height="250"></canvas>
</div>
<div class="btns" id="btns">
  <button data-s="collect" class="on">Recolectando</button>
  <button data-s="read">Leyendo</button>
  <button data-s="build">Construyendo</button>
  <button data-s="clean">Limpiando</button>
  <button data-s="done">Confirmado</button>
  <button data-s="idle">Pensando</button>
</div>
<p class="note">// los bits SON los datos: se ordenan cuando el agente los ordena — sin telemetría, orbitan en neutro</p>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=560,H=250,CX=W/2,CY=H/2;
const N=120,GLITCH='#%?!§~';
let t=0,state='collect',parts=[];
for(let i=0;i<N;i++)parts.push({x:Math.random()*W,y:Math.random()*H,c:Math.random()<.5?'0':'1',f:Math.floor(Math.random()*200)});
function targets(s){const T=[];
 if(s==='collect'){for(let i=0;i<N;i++){
  if(i<44){const a=i/44*Math.PI*2+t*.004;T.push({x:CX+Math.cos(a)*215,y:CY+Math.sin(a)*98,col:'#EC4899',a:.9});}
  else{const k=i-44;T.push({x:CX-52+(k%9)*13,y:CY-40+Math.floor(k/9)*13,col:'#7C3AED',a:1});}}}
 else if(s==='read'){for(let i=0;i<N;i++){const row=i%6,col=Math.floor(i/6);
  const px=CX-125+col*13;const hot=Math.abs(px-(CX-125+((t*1.8)%250)))<16;
  T.push({x:px,y:CY-42+row*17,col:hot?'#EC4899':'#7C3AED',a:hot?1:.75});}}
 else if(s==='build'){const cols=12,rows=6;for(let i=0;i<N;i++){const idx=i%(cols*rows);
  const built=(t*.5)%(cols*rows+30);
  if(idx<built)T.push({x:CX-cols*6.5+(idx%cols)*13,y:CY+48-Math.floor(idx/cols)*15,col:'#7C3AED',a:1});
  else T.push({x:CX+(Math.random()-.5)*300,y:CY-95,col:'#EC4899',a:.8});}}
 else if(s==='clean'){const sweep=((t*1.6)%400)-30;for(let i=0;i<N;i++){
  const hx=40+(i*97)%(W-80),hy=40+(i*61)%(H-90);
  if(hx<CX-170+sweep){const k=i%80;T.push({x:CX-130+(k%16)*17,y:H-52+Math.floor(k/16)*13,col:'#5DCAA5',a:1,bin:true});}
  else T.push({x:hx,y:hy,col:'#E24B4A',a:.75,dirty:true});}}
 else if(s==='done'){for(let i=0;i<N;i++){const p=i/N;let px,py;
  if(p<.4){px=CX-58+p/.4*44;py=CY-8+p/.4*40;}else{px=CX-14+(p-.4)/.6*82;py=CY+32-(p-.4)/.6*72;}
  T.push({x:px+(i%3-1)*3,y:py+(Math.floor(i/3)%3-1)*3,col:'#5DCAA5',a:1});}}
 else{for(let i=0;i<N;i++){const a=i/N*Math.PI*2+t*.006;
  T.push({x:CX+Math.cos(a)*(78+Math.sin(t*.02+i)*7),y:CY+Math.sin(a)*(48+Math.cos(t*.02+i)*6),col:'#6d5bc9',a:.55});}}
 return T;}
function frame(){t++;const T=targets(state);
 x.clearRect(0,0,W,H);
 x.font='11px "JetBrains Mono",monospace';x.textAlign='center';x.textBaseline='middle';
 for(let i=0;i<N;i++){const p=parts[i],g=T[i];
  p.x+=(g.x-p.x)*.08;p.y+=(g.y-p.y)*.08;
  if(--p.f<0){p.f=40+Math.random()*160;
   p.c=g.dirty?GLITCH[Math.floor(Math.random()*GLITCH.length)]:(Math.random()<.5?'0':'1');}
  if(g.dirty&&'01'.includes(p.c))p.c=GLITCH[Math.floor(Math.random()*GLITCH.length)];
  if(!g.dirty&&!'01'.includes(p.c))p.c=Math.random()<.5?'0':'1';
  const jx=g.dirty?(Math.random()-.5)*2.4:0,jy=g.dirty?(Math.random()-.5)*2.4:0;
  x.globalAlpha=g.a*(.75+.25*Math.sin(t*.05+i));
  x.fillStyle=g.col;x.fillText(p.c,p.x+jx,p.y+jy);}
 x.globalAlpha=1;
 if(state==='clean'){const sx2=CX-170+(((t*1.6)%400)-30);
  if(sx2>0&&sx2<W){x.strokeStyle='rgba(236,72,153,.6)';x.lineWidth=1.5;
   x.beginPath();x.moveTo(sx2,26);x.lineTo(sx2,H-64);x.stroke();
   x.fillStyle='rgba(236,72,153,.08)';x.fillRect(sx2-14,26,14,H-90);}}
 requestAnimationFrame(frame);}
const L={collect:['Recolectando información','grafo-a2a · 3 de 7 fuentes'],read:['Leyendo documentos','BUSINESS_LOGIC.md · pág 4'],build:['Construyendo entregable','PRP-cliente.md · sección 2 de 5'],clean:['Limpiando datos','purgando corrupción · 82%'],done:['Confirmado on-chain','txHash 0x7f3a…c21e ✓'],idle:['Pensando','esperando telemetría de la cola']};
document.getElementById('btns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 state=b.dataset.s;
 document.querySelectorAll('#btns button').forEach(o=>o.classList.remove('on'));
 b.classList.add('on');
 document.getElementById('lbl').textContent=L[state][0];
 document.getElementById('sub').textContent=L[state][1];});
frame();
</script>
</body>
</html>
