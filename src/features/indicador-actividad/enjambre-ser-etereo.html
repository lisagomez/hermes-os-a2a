<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ser etereo -> profesion (WebGL2, calido)</title>
<style>
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{background:#070610;color:#EFEAE2;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .hud{position:fixed;font-family:'JetBrains Mono',ui-monospace,monospace;pointer-events:none;}
  #top{top:16px;left:18px;font-size:11px;line-height:1.7;color:#8a8378;}
  #top .n{color:#FFD9A0;font-weight:700;}
  #big{top:14px;right:18px;text-align:right;}
  #big .l{font-size:20px;font-weight:700;}
  #big .s{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#9a9488;margin-top:3px;}
  #chips{left:0;right:0;bottom:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:auto;}
  #chips button{font-family:inherit;font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid #3a352e;background:rgba(18,16,24,.6);color:#d8d2c8;cursor:pointer;backdrop-filter:blur(4px);transition:.15s;}
  #chips button:hover{border-color:#6a6152;} #chips button.on{color:#fff;border-color:#8a7d64;}
  #note{left:0;right:0;bottom:56px;text-align:center;font-size:10px;color:#655d50;pointer-events:none;}
  #fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:14px;color:#FBBF24;line-height:1.6;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="top">
  <div><span class="n" id="count">0</span> particulas</div>
  <div><span class="n" id="fps">0</span> fps · <span id="tier">-</span></div>
  <div>WebGL2 · adaptativo</div>
</div>
<div class="hud" id="big"><div class="l" id="label">un ser</div><div class="s">se adapta al agente que necesitas</div></div>
<div class="hud" id="note">// una presencia calida que se transforma en quien la necesitas, sin dejar de sentirse humana</div>
<div class="hud" id="chips"></div>
<div id="fallback">Tu navegador no expone WebGL2 (~5%). El sitio caeria a una version Canvas 2D ligera (fallback pendiente).</div>

<script>
"use strict";
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', { antialias:true, alpha:false });
if(!gl){ document.getElementById('fallback').style.display='flex'; }
else {
const coarse=matchMedia('(pointer:coarse)').matches, small=Math.min(innerWidth,innerHeight)<720, cores=navigator.hardwareConcurrency||4;
const mobile=coarse||small; const N=mobile?9000:(cores>=8?38000:20000);
document.getElementById('count').textContent=N.toLocaleString('es');
document.getElementById('tier').textContent=mobile?'movil (ligero)':(cores>=8?'desktop (alto)':'desktop');
const DPR_CAP=mobile?1.5:2;

function hex(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
const SHAPES = {
  // el "ser": NO una cabeza solida, sino luz calida aireada (nucleo arriba + aura). Se muestrea por brillo.
  ser:{ color:'#FFE8C8', label:'un ser', draw(o,S){
    let g=o.createRadialGradient(S/2,S*0.58,0,S/2,S*0.58,S*0.42);
    g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(0.55,'rgba(255,255,255,0.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
    o.fillStyle=g; o.beginPath(); o.ellipse(S/2,S*0.58,S*0.24,S*0.36,0,0,6.283); o.fill();
    let g2=o.createRadialGradient(S/2,S*0.34,0,S/2,S*0.34,S*0.2);
    g2.addColorStop(0,'rgba(255,255,255,1)'); g2.addColorStop(0.6,'rgba(255,255,255,0.4)'); g2.addColorStop(1,'rgba(255,255,255,0)');
    o.fillStyle=g2; o.beginPath(); o.arc(S/2,S*0.34,S*0.17,0,6.283); o.fill(); } },
  contador:{ color:'#6EE7B7', label:'Contador', draw(o,S){ const cx=S/2,cy=S/2,w=S*0.4,h=S*0.56,x=cx-w/2,y=cy-h/2;
    o.lineWidth=S*0.035; o.strokeRect(x,y,w,h); o.fillRect(x+S*0.05,y+S*0.05,w-S*0.1,h*0.16);
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)o.fillRect(x+S*0.06+c*(w-S*0.1)/2.6,y+h*0.32+r*h*0.19,w*0.13,h*0.11); } },
  ingeniero:{ color:'#C4B5FD', label:'Ing. de Sistemas', draw(o,S){ o.textAlign='center';o.textBaseline='middle';
    o.font='bold '+(S*0.32)+'px "JetBrains Mono",monospace'; o.fillText('</>',S/2,S/2); } },
  medico:{ color:'#FDA4AF', label:'Medico', draw(o,S){ const cx=S/2,cy=S/2,t=S*0.17,l=S*0.52;
    o.fillRect(cx-t/2,cy-l/2,t,l); o.fillRect(cx-l/2,cy-t/2,l,t); } },
  financiero:{ color:'#FCD34D', label:'Financiero', draw(o,S){ o.textAlign='center';o.textBaseline='middle';
    o.font='bold '+(S*0.72)+'px "Space Grotesk",sans-serif'; o.fillText('$',S/2,S/2); } },
};
function sample(drawFn){ const S=224,oc=document.createElement('canvas');oc.width=S;oc.height=S;
  const o=oc.getContext('2d'); o.fillStyle='#fff';o.strokeStyle='#fff'; drawFn(o,S);
  const d=o.getImageData(0,0,S,S).data,pts=[];
  for(let y=0;y<S;y+=2)for(let x=0;x<S;x+=2){ const al=d[(y*S+x)*4+3];   // muestreo PROBABILISTICO por brillo = aireado
    if(al>16 && Math.random()<(al/255)*0.9) pts.push([(x/S-0.5)*1.55,-(y/S-0.5)*1.55]); } return pts; }
for(const k in SHAPES){ const pts=sample(SHAPES[k].draw), L=pts.length||1, a=new Float32Array(N*2);
  for(let i=0;i<N;i++){ const p=pts[(i*7919)%L]; a[i*2]=p[0]+(Math.random()-.5)*.014; a[i*2+1]=p[1]+(Math.random()-.5)*.014; }
  SHAPES[k].pos=a; SHAPES[k].rgb=hex(SHAPES[k].color); }

const VERT=`#version 300 es
precision highp float;
layout(location=0) in vec2 aFrom; layout(location=1) in vec2 aTo; layout(location=2) in vec2 aSeed;
uniform float uMorph,uAspect,uScatter,uTime; uniform vec3 uColA,uColB;
out vec3 vCol; out float vGlow;
void main(){
  float m=smoothstep(0.0,1.0,uMorph); vec2 pos=mix(aFrom,aTo,m);
  float sc=sin(uMorph*3.14159265); float ang=aSeed.y*6.2831853;
  pos+=vec2(cos(ang),sin(ang))*sc*uScatter*(0.35+aSeed.x*0.9);
  pos+=vec2(sin(uTime*0.5+aSeed.x*31.0), cos(uTime*0.42+aSeed.y*27.0))*0.013;  // deriva luciernaga (vivo en reposo)
  pos*=1.0+0.025*sin(uTime*0.8);                                                // respiracion
  gl_Position=vec4(pos.x/uAspect,pos.y,0.0,1.0);
  gl_PointSize=mix(2.0,5.6,aSeed.x)*(0.9+sc*0.5);
  vec3 warm=vec3(1.0,0.82,0.55), cool=vec3(0.5,0.85,1.0);
  vCol=mix(uColA,uColB,m)*mix(cool,warm,aSeed.x);                               // calido + frio por particula
  vGlow=(0.30+0.5*aSeed.x)*(0.62+0.38*sin(uTime*1.6+aSeed.y*19.0));             // titileo
}`;
const FRAG=`#version 300 es
precision highp float; in vec3 vCol; in float vGlow; out vec4 frag;
void main(){ vec2 c=gl_PointCoord*2.0-1.0; float d=dot(c,c); if(d>1.0)discard;
  float a=exp(-d*2.4)*vGlow*0.55; frag=vec4(vCol*a,a); }`;                       // glow suave, onirico
function mk(t,s){ const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh; }
const prog=gl.createProgram(); gl.attachShader(prog,mk(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U={ morph:gl.getUniformLocation(prog,'uMorph'), aspect:gl.getUniformLocation(prog,'uAspect'),
  scatter:gl.getUniformLocation(prog,'uScatter'), time:gl.getUniformLocation(prog,'uTime'),
  colA:gl.getUniformLocation(prog,'uColA'), colB:gl.getUniformLocation(prog,'uColB') };
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const bFrom=gl.createBuffer(),bTo=gl.createBuffer(),bSeed=gl.createBuffer();
const seed=new Float32Array(N*2); for(let i=0;i<N;i++){ seed[i*2]=Math.random(); seed[i*2+1]=Math.random(); }
gl.bindBuffer(gl.ARRAY_BUFFER,bSeed); gl.bufferData(gl.ARRAY_BUFFER,seed,gl.STATIC_DRAW); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,2,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,bFrom); gl.bufferData(gl.ARRAY_BUFFER,SHAPES.ser.pos,gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,bTo); gl.bufferData(gl.ARRAY_BUFFER,SHAPES.contador.pos,gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,2,gl.FLOAT,false,0,0);
gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE);

let fromKey='ser', toKey='contador', morph=0, hold=0, auto=true;
const SEQ=['contador','ingeniero','medico','financiero']; let seqI=0;
function setTransition(from,to){ fromKey=from; toKey=to; morph=0; hold=0;
  gl.bindBuffer(gl.ARRAY_BUFFER,bFrom); gl.bufferData(gl.ARRAY_BUFFER,SHAPES[from].pos,gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bTo); gl.bufferData(gl.ARRAY_BUFFER,SHAPES[to].pos,gl.DYNAMIC_DRAW);
  document.getElementById('label').textContent=SHAPES[to].label;
  [...document.querySelectorAll('#chips button')].forEach(b=>b.classList.toggle('on',b.dataset.k===to)); }
function nextAuto(){ if(toKey==='ser'){ seqI=(seqI+1)%SEQ.length; setTransition('ser',SEQ[seqI]); } else setTransition(toKey,'ser'); }
const chipRow=document.getElementById('chips');
SEQ.forEach(k=>{ const b=document.createElement('button'); b.dataset.k=k; b.textContent=SHAPES[k].label; chipRow.appendChild(b); });
const atg=document.createElement('button'); atg.textContent='⏸ auto'; atg.dataset.k='__auto'; chipRow.appendChild(atg);
chipRow.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.k==='__auto'){ auto=!auto; atg.textContent=(auto?'⏸':'▶')+' auto'; return; }
  auto=false; atg.textContent='▶ auto'; setTransition(morph<1?fromKey:toKey, b.dataset.k); });

let dpr=1; function resize(){ dpr=Math.min(window.devicePixelRatio||1,DPR_CAP);
  cv.width=Math.floor(cv.clientWidth*dpr); cv.height=Math.floor(cv.clientHeight*dpr); gl.viewport(0,0,cv.width,cv.height); }
window.addEventListener('resize',resize); resize();
let last=performance.now(),frames=0,raf=0,t0=performance.now();
function frame(now){ const dt=Math.min(50,now-last)/1000; last=now; frames++;
  if(morph<1){ morph=Math.min(1,morph+dt/2.4); } else { hold+=dt; if(hold>1.2 && auto) nextAuto(); }
  gl.clearColor(0.027,0.024,0.043,1.0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.morph,morph); gl.uniform1f(U.aspect,cv.width/cv.height); gl.uniform1f(U.scatter,0.42); gl.uniform1f(U.time,(now-t0)/1000);
  gl.uniform3fv(U.colA,SHAPES[fromKey].rgb); gl.uniform3fv(U.colB,SHAPES[toKey].rgb);
  gl.drawArrays(gl.POINTS,0,N); raf=requestAnimationFrame(frame); }
setInterval(()=>{ document.getElementById('fps').textContent=Math.round(frames*2); frames=0; },500);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) cancelAnimationFrame(raf); else { last=performance.now(); raf=requestAnimationFrame(frame); } });
setTransition('ser','contador'); last=performance.now(); raf=requestAnimationFrame(frame);
}
</script>
</body>
</html>
