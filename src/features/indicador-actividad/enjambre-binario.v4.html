<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes OS · Enjambre Binario v3 — 18 estados</title>
<style>
  :root{ --bg:#0E0E12; --panel:#141318; --panel2:#17161d; --line:#26262e; --ink:#E7E5F0; --mut:#8b8b96; --code:#AFA9EC; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 120% at 50% 18%,#16151c 0%,var(--bg) 60%,#08080b 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font-family:'Space Grotesk',system-ui,sans-serif;padding:26px;color:var(--ink);}
  .panel{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.85);}
  .hdr{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--code);
    background:rgba(124,58,237,.12);padding:3px 7px;border-radius:6px;margin-right:10px;}
  .lbl{font-size:14px;font-weight:600;}
  .sub{font-size:10.5px;color:var(--mut);font-family:'JetBrains Mono',monospace;text-align:right;}
  canvas{display:block;width:100%;background:transparent;}
  .controls{width:100%;max-width:620px;display:flex;flex-direction:column;gap:9px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .cap{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-family:'JetBrains Mono',monospace;width:100%;margin-bottom:1px;}
  button{font-size:11.5px;padding:5px 10px;background:var(--panel2);border:1px solid #34343e;border-radius:8px;color:#c9c9d1;cursor:pointer;font-family:inherit;transition:.15s;}
  button:hover{border-color:#4a4a56;}
  button.on{border-color:#7C3AED;color:#DED9FA;background:rgba(124,58,237,.16);}
  button:focus-visible{outline:2px solid #7C3AED;outline-offset:2px;}
  .note{font-size:10.5px;color:#66666e;font-family:'JetBrains Mono',monospace;text-align:center;max-width:620px;margin:0;line-height:1.5;}
</style>
</head>
<body>
<div class="panel">
  <div class="hdr">
    <div style="display:flex;align-items:center;"><span class="code" id="code">AGT-HERMES-07</span><span class="lbl" id="lbl">Pensando</span></div>
    <span class="sub" id="sub">esperando telemetria de la cola</span>
  </div>
  <canvas id="cv" width="620" height="280"></canvas>
</div>
<div class="controls">
  <div class="row" id="states"><span class="cap">Estado del agente (10 base + 8 futuros)</span></div>
  <div class="row" id="progress">
    <span class="cap">Verificacion de progreso</span>
    <button data-p="cycle">Ciclo</button><button data-p="bar" class="on">Barra</button>
    <button data-p="pct">%</button><button data-p="counter">Contador</button><button data-p="off">Off</button>
    <button id="auto" style="margin-left:auto;">⏸ Auto</button>
  </div>
</div>
<p class="note">// v3: motor de 18 estados separado del render (Canvas 2D hoy, swappable a WebGL/WebGPU). La senal es MOVIMIENTO+COLOR, no iconos. Autoplay; anima con reduced-motion.</p>

<script>
"use strict";
// ╔═ MOTOR (framework-agnostico) — este bloque se extrae a enjambre-engine.ts para el componente React ═╗
const C = { base:'#7C3AED', hot:'#EC4899', alt:'#38BDF8', ok:'#34D399', bad:'#F87171', warn:'#FBBF24',
            blue:'#60A5FA', bone:'#EAE6D8', dim:'#5b5570' };
const GLITCH='#%?!§~¬';
const W=620,H=280,CX=W/2,CY=118,STRIP_Y=236,N=200;

// slots precomputados (formas distintas)
const WRITE_SLOTS=[]; (()=>{ const lens=[32,27,30,19,28,22,25,13],ox=CX-112,oy=CY-54,cw=7,ch=15;
  for(let r=0;r<lens.length;r++)for(let c=0;c<lens[r];c++)WRITE_SLOTS.push({x:ox+c*cw,y:oy+r*ch}); })();
const BUILD_SLOTS=[]; (()=>{ const tw=[3,5,4,6,5,7,4,6,3],bw=3,cw=6,gx=2,ch=13,baseY=CY+64,mH=7,
  totalW=tw.length*(bw+gx)*cw-gx*cw,ox=CX-totalW/2;
  for(let l=0;l<mH;l++)for(let ti=0;ti<tw.length;ti++)if(l<tw[ti]){const bx=ox+ti*(bw+gx)*cw;
    for(let k=0;k<bw;k++)BUILD_SLOTS.push({x:bx+k*cw,y:baseY-l*ch});} })();
const ORIGINS=[{x:60,y:40},{x:W-60,y:40},{x:70,y:H-90},{x:W-70,y:H-90},{x:CX,y:26}]; // recolectar
const PLAN_NODES=[]; (()=>{ for(let i=0;i<12;i++)PLAN_NODES.push({x:CX-150+i*27,y:CY}); })();
const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

// STATES: orden + etiqueta. Cada target(i,tt) -> {x,y,col,a,dirty?}
const STATES=['pensar','leer','recolectar','escribir','construir','limpiar','negociar','esperar','bloqueado','confirmado',
  'buscar','planear','herramienta','verificar','reintentar','enrutar','streaming','desplegar'];
const LABEL={
  pensar:['Pensando','esperando telemetria'], leer:['Leyendo documentos','BUSINESS_LOGIC.md · pag 4'],
  recolectar:['Recolectando','grafo-a2a · 3 de 7 fuentes'], escribir:['Escribiendo entregable','PRP-cliente.md'],
  construir:['Construyendo','ensamblando 5 modulos'], limpiar:['Limpiando datos','purgando corrupcion'],
  negociar:['Negociando A2A','ejecutor ⇄ supervisor'], esperar:['Esperando gate','revision humana pendiente'],
  bloqueado:['Bloqueado','dependencia sin resolver'], confirmado:['Confirmado on-chain','txHash 0x7f3a…c21e ✓'],
  buscar:['Buscando en la web','3 dominios consultados'], planear:['Planeando','armando DAG de 6 pasos'],
  herramienta:['Llamando herramienta','run: read_file()'], verificar:['Verificando','corriendo 24 tests'],
  reintentar:['Reintentando','intento 2 de 3'], enrutar:['Enrutando','eligiendo modelo/rama'],
  streaming:['Transmitiendo','streaming de salida'], desplegar:['Desplegando','push a produccion'] };

const T = {
  pensar(i,tt){ const hs=a=>{const x=Math.sin(a)*43758.5453;return x-Math.floor(x);}, u1=hs(i*.123+1)+1e-6, u2=hs(i*.577+2), g=Math.sqrt(-2*Math.log(u1)), th=6.283*u2, bi=.5+.5*Math.sin(tt*.03+i*.9), spr=28+20*bi, dx=Math.sin(tt*.024+i*1.7)*5, dy=Math.cos(tt*.027+i*2.1)*5,
    sk=Math.sin(i*7.3+tt*.06)>.985; return {x:CX+g*Math.cos(th)*spr*1.15+dx,y:CY+g*Math.sin(th)*spr*.72+dy,col:sk?C.hot:C.base,a:sk?.95:.4+.3*bi}; },  // blob de pensamiento GAUSSIANO (Box-Muller por hash de i): denso al centro, cae suave -> nube LLENA sin anillo ni hueco (no "agujero negro"). Respiracion DESINCRONIZADA por particula (fase i*.9) + microderiva = converge/diverge organico. Chispa rosa = idea que asoma. Ver cerebro F363
  esperar(i,tt){ const a=i/N*6.283,r=66,d=Math.sin(tt*.012+i)*1.2,b=.5+.5*Math.sin(tt*.03);
    return {x:CX+Math.cos(a)*r*1.55+d,y:CY+Math.sin(a)*r*.72+d,col:C.warn,a:.24+.34*b}; },
  leer(i,tt){ const cols=36,g={x:CX-cols*3.5+(i%cols)*7,y:CY-52+((i/cols)|0)*15},scan=CX-cols*3.5+((tt*2.2)%(cols*7)),h=Math.abs(g.x-scan)<11;
    return {x:g.x,y:g.y,col:h?C.hot:C.base,a:h?1:.7}; },
  recolectar(i,tt){ const o=ORIGINS[i%5],ph=(((tt*.9+i*11)%210)/210),e=ease(ph);
    return {x:lerp(o.x,CX+(i%7-3)*7,e),y:lerp(o.y,CY+((i%5)-2)*7,e),col:e>.8?C.hot:C.base,a:.4+.6*e}; },
  escribir(i,tt){ const S=WRITE_SLOTS,cur=(tt*1.1)%(S.length+46);
    if(i<S.length&&i<cur){const hd=i>=cur-1.6;return {x:S[i].x,y:S[i].y,col:hd?C.hot:C.base,a:hd?1:.85};}
    return {x:CX+Math.sin(i*12.9+tt*.02)*140,y:CY-98,col:C.base,a:.26}; },
  construir(i,tt){ const S=BUILD_SLOTS,bt=(tt*.4)%(S.length+64);
    if(i<S.length&&i<bt){const fr=i>=bt-4;return {x:S[i].x,y:S[i].y,col:fr?C.hot:C.base,a:1};}
    const s=i%2?1:-1;return {x:CX+s*(150+Math.sin(i*3.1+tt*.05)*40),y:CY-70+Math.cos(i*2.3+tt*.04)*34,col:C.base,a:.5}; },
  limpiar(i,tt){ const cp=(tt*.5)%(N+50); if(i<cp){ const k=i%140,g={x:CX-119+(k%20)*12,y:CY-30+((k/20)|0)*15};
      return {x:g.x,y:g.y,col:C.ok,a:1}; }
    const hx=50+(i*89)%(W-100),hy=30+(i*53)%(STRIP_Y-70);return {x:hx,y:hy,col:C.bad,a:.7,dirty:true}; },
  negociar(i,tt){ const L=i%2===0,hub={x:CX+(L?-120:120),y:CY};
    if(i%7===0){const ph=((tt*.9+i*17)%170)/170,e=ease(ph),f=L?-120:120;
      return {x:CX+f+(-2*f)*e,y:CY-Math.sin(ph*Math.PI)*44,col:C.hot,a:1};}
    const a=i/N*6.283+tt*.01;return {x:hub.x+Math.cos(a)*40,y:hub.y+Math.sin(a)*40,col:L?C.base:C.alt,a:.8}; },
  bloqueado(i,tt){ const p=i/N,d=p<.5?p/.5:(p-.5)/.5,jx=(Math.random()-.5)*2.6,jy=(Math.random()-.5)*2.6;
    return {x:CX-66+d*132+jx,y:CY-52+(p<.5?d:1-d)*104+jy,col:C.bad,a:.92}; },
  confirmado(i,tt){ const p=i/N;let x,y; if(p<.4){x=CX-58+p/.4*40;y=CY-4+p/.4*38;}else{x=CX-18+(p-.4)/.6*80;y=CY+34-(p-.4)/.6*70;}
    return {x:x+(i%3-1)*3,y:y+(((i/3)|0)%3-1)*3,col:C.ok,a:1}; },
  buscar(i,tt){ const hs=a=>{const x=Math.sin(a)*43758.5453;return x-Math.floor(x);}, beam=((tt*0.0038)%1)*6.283;  // RADAR de AGUJA (referencia de Johann makeagif jWkIkG): vuelta completa ~4.4s
    if(i<44){ const fr=i/44, r=fr*128; return {x:CX+Math.cos(beam)*r*1.5,y:CY+Math.sin(beam)*r*.68,col:C.blue,a:.5+.5*fr}; }  // la AGUJA: linea radial que rota
    const k=i-44, th=hs(k*1.3+7)*6.283, rr=(0.15+hs(k*2.9+3)*0.85)*128; let lag=beam-th; if(lag<0)lag+=6.283;  // CAMPO fijo disperso por hash; lag = cuanto hace que la aguja lo barrio
    const isBlip=(k%16)===0, glow=Math.exp(-lag*(isBlip?0.55:1.6));  // estela corta (cuna que se desvanece tras la aguja) / blip persiste casi toda la vuelta
    return {x:CX+Math.cos(th)*rr*1.5,y:CY+Math.sin(th)*rr*.68,col:(isBlip&&glow>.25)?C.hot:C.blue,a:isBlip?(0.1+0.9*glow):(glow*0.55+0.03)}; },  // aguja rotatoria + estela angular + ~10 blips que destellan al ser barridos y decaen lento = radar inconfundible (la rotacion de una AGUJA recta no lee como vortice; la espiral de particulas si lo hacia). Calibrado con filmstrip (pipeline ver-animacion). F363 radar/sonar.
  planear(i,tt){ const al=.5+.5*Math.sin(tt*.02),nd=PLAN_NODES[i%12],sc={x:CX+Math.sin(i*9.1)*160,y:CY+Math.cos(i*5.3)*70},
    lit=Math.floor((tt*.06)%12)===(i%12);
    return {x:lerp(sc.x,nd.x,al),y:lerp(sc.y,nd.y,al),col:lit?C.hot:C.base,a:.55+.4*al}; },
  herramienta(i,tt){ const a=i*2.399+tt*.14,r=22+(i%3)*7; return {x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,col:C.alt,a:.8+.2*Math.sin(tt*.1+i)}; },
  verificar(i,tt){ const cols=36,rows=6,rowH=15,gx=CX-cols*3.5+(i%cols)*7,gy=CY-52+((i/cols)|0)*rowH,
    scanY=CY-52+((tt*0.7)%(rows*rowH)),done=gy<scanY,at=Math.abs(gy-scanY)<7.5;
    return {x:gx,y:gy,col:at?C.warn:(done?C.ok:C.base),a:at?1:(done?.85:.5)}; },
  reintentar(i,tt){ const c=(1-Math.cos(tt*.07))/2,r=(18+(i%6)*10)*(.15+c*.95),a=i/N*6.283+tt*.02;
    return {x:CX+Math.cos(a)*r*1.4,y:CY+Math.sin(a)*r*.75,col:c>.85?C.ok:C.warn,a:.5+.4*c}; },
  enrutar(i,tt){ const g=i%3,cx=CX+(g-1)*95,win=Math.floor((tt*.02)%3),a=i*2.399+tt*.03,r=30;
    return {x:cx+Math.cos(a)*r,y:CY+Math.sin(a)*r,col:C.hot,a:g===win?1:.28}; },
  streaming(i,tt){ if(i<6){ const bl=(tt%42<26)?1:.22; return {x:CX+150,y:CY+(i-2.5)*5,col:C.bone,a:bl}; }  // CURSOR: barra vertical parpadeante en la SALIDA (la señal "vivo" mas barata, F363)
    const j=i-6, ph=((tt*1.3+j*7)%200)/200;  // goteo continuo del nucleo (izq) a la salida (der); brillo CRECE hacia la salida (antes invertido: brillaba en el origen)
    return {x:lerp(CX-72,CX+140,ph),y:CY+((j%5)-2)*4.4,col:C.bone,a:0.1+ph*0.88}; },
  desplegar(i,tt){ const ph=((tt*1.1+i*4)%150)/150, fail=deployFail;  // 1 de cada 3 despliegues FALLA, sorteado al ENTRAR al estado (columna comparte desenlace; antes dependia del reloj global, que ya no corre libre)
    if(fail){
      if(ph<.5){ const e=ph/.5; return {x:CX+((i%7)-3)*5,y:lerp(STRIP_Y-20,CY-84,e*e),col:C.base,a:.5+e*.5}; }  // asciende...
      const e=(ph-.5)/.5; return {x:CX+((i%7)-3)*5+Math.sin(i*7.1)*4*e,y:lerp(CY-84,STRIP_Y-6,e*e),col:C.bad,a:1-e*.4}; }  // ...y CAE en rojo, acelerando hacia abajo
    if(ph<.7){ const e=ph/.7; return {x:CX+((i%7)-3)*5,y:lerp(STRIP_Y-20,CY-70,e*e*e),col:C.base,a:.5+e*.5}; }  // EXITO: asciende acelerando (e^3)
    const e=(ph-.7)/.3,ang=i*2.399; return {x:CX+Math.cos(ang)*e*130,y:(CY-70)-Math.abs(Math.sin(ang))*e*36,col:C.ok,a:1-e}; }  // ...y se dispersa en arco verde
};
// ╚═ fin motor ═╝

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// duracion de auto-avance POR ESTADO (frames, ~60fps): SIEMPRE >= 2 vueltas completas de la animacion propia
// (PERIOD, leido de la formula real de cada T[s]) y >= MIN_DUR (3s), lo que sea mayor. bloqueado/confirmado/
// herramienta no tienen "vuelta" agrupada (estatico o continuo) -> solo aplica el piso.
const MIN_DUR=3*60;
const PERIOD={ pensar:2*Math.PI/.03, leer:36*7/2.2, recolectar:210/.9, escribir:(WRITE_SLOTS.length+46)/1.1,
  construir:(BUILD_SLOTS.length+64)/.4, limpiar:(N+50)/.5, negociar:170/.9, esperar:2*Math.PI/.03,
  buscar:1/.0038, planear:12/.06, verificar:(6*15)/.7, reintentar:2*Math.PI/.07, enrutar:3/.02,
  streaming:200/1.3, desplegar:150/1.1 };
const LOOP_MULT={ construir:1.5, limpiar:1.5 };  // los 2 mas largos (~8s/vuelta): 1.5 vueltas basta, 2 los infla a 16-17s cada uno
const AUTO_DUR={}; STATES.forEach(s=>{ const m=LOOP_MULT[s]||2; AUTO_DUR[s]=Math.max(MIN_DUR, PERIOD[s]?Math.ceil(m*PERIOD[s]):MIN_DUR); });
let t=0,stateT=0,state='pensar',progMode='bar',auto=true,prog=.12,autoT=0,cycT=0,cycI=0,deployFail=false;  // default BARRA (info funcional pide estabilidad); Ciclo = showcase
const CYCLE=['bar','pct','counter'];
let transT=999; const TRANS_FRAMES=42;  // ease-in de la persecucion tras un cambio de estado (transicion suave, no salto brusco)
const parts=[]; for(let i=0;i<N;i++)parts.push({x:Math.random()*W,y:Math.random()*(STRIP_Y-10),c:Math.random()<.5?'0':'1',f:(Math.random()*160)|0,s:.06+Math.random()*.06});

function drawStrip(){ const m=progMode==='cycle'?CYCLE[cycI]:progMode; if(m==='off')return; ctx.save();
  ctx.textBaseline='middle'; const cy=STRIP_Y+16;
  if(m==='bar'){ const sl=44,x0=CX-sl*6.2/2,fl=Math.round(prog*sl); ctx.textAlign='center'; ctx.font='11px "JetBrains Mono",monospace';
    for(let k=0;k<sl;k++){const on=k<fl;ctx.globalAlpha=on?1:.25;ctx.fillStyle=on?C.base:C.dim;ctx.fillText(on?(k%2?'1':'0'):'0',x0+k*6.2+3,cy);}
    ctx.globalAlpha=1;ctx.fillStyle=C.hot;ctx.textAlign='left';ctx.fillText(Math.round(prog*100)+'%',x0+sl*6.2+10,cy);
  } else if(m==='pct'){ ctx.textAlign='center';ctx.fillStyle=C.base;ctx.font='700 26px "Space Grotesk",sans-serif';ctx.fillText(Math.round(prog*100)+'%',CX,cy);
  } else { const tot=7,n=Math.round(prog*tot);ctx.textAlign='center';ctx.font='700 20px "JetBrains Mono",monospace';ctx.fillStyle=C.base;ctx.fillText(n+' / '+tot,CX,cy); }
  ctx.restore(); }

function frame(){ t++; stateT++; prog+=.0016; if(prog>1)prog=0;
  if(auto&&++autoT>AUTO_DUR[state]){autoT=0;setState(STATES[(STATES.indexOf(state)+1)%STATES.length],false);}
  if(progMode==='cycle'&&++cycT>360){cycT=0;cycI=(cycI+1)%CYCLE.length;}  // showcase rota cada ~6s (estudio: formato estable, cambio ocasional)
  ctx.clearRect(0,0,W,H); ctx.font='11px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const fn=T[state]; transT++;
  const chaseMul=transT<TRANS_FRAMES?.28+.72*ease(Math.min(1,transT/TRANS_FRAMES)):1;
  for(let i=0;i<N;i++){ const p=parts[i],g=fn(i,stateT); p.x+=(g.x-p.x)*p.s*chaseMul; p.y+=(g.y-p.y)*p.s*chaseMul;
    if(--p.f<0){p.f=40+(Math.random()*150|0);p.c=g.dirty?GLITCH[(Math.random()*GLITCH.length)|0]:(Math.random()<.5?'0':'1');}
    if(g.dirty&&'01'.includes(p.c))p.c=GLITCH[(Math.random()*GLITCH.length)|0];
    if(!g.dirty&&!'01'.includes(p.c))p.c=Math.random()<.5?'0':'1';
    const jx=(g.dirty&&!reduce)?(Math.random()-.5)*2.4:0,jy=(g.dirty&&!reduce)?(Math.random()-.5)*2.4:0,br=g.a>.85;
    ctx.globalAlpha=g.a*(reduce?.9:(.78+.22*Math.sin(t*.05+i))); ctx.shadowBlur=br?8:0; ctx.shadowColor=br?g.col:'transparent';
    ctx.fillStyle=g.col; ctx.fillText(p.c,p.x+jx,p.y+jy); }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  if(state==='leer'){ const cols=36,sx=CX-cols*3.5+((stateT*2.2)%(cols*7));
    ctx.strokeStyle='rgba(236,72,153,.5)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(sx,CY-58);ctx.lineTo(sx,CY+56);ctx.stroke(); }
  else if(state==='verificar'){ const cols=36,rows=6,rowH=15,sy=CY-52+((stateT*0.7)%(rows*rowH));
    ctx.strokeStyle='rgba(251,191,36,.55)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(CX-cols*3.5,sy);ctx.lineTo(CX+cols*3.5,sy);ctx.stroke(); }
  drawStrip(); requestAnimationFrame(frame); }

function setState(s,manual){ state=s; transT=0; autoT=0; stateT=0; if(s==='desplegar')deployFail=Math.random()<1/3;  // reloj propio del estado arranca en 0: la animacion siempre empieza desde el inicio
  document.querySelectorAll('#states button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.getElementById('lbl').textContent=LABEL[s][0]; document.getElementById('sub').textContent=LABEL[s][1];
  if(manual){auto=false;const a=document.getElementById('auto');a.textContent='▶ Auto';a.classList.remove('on');} }

// construir botones de estado
const sr=document.getElementById('states');
STATES.forEach(s=>{ const b=document.createElement('button'); b.dataset.s=s; b.textContent=LABEL[s][0]; sr.appendChild(b); });
sr.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setState(b.dataset.s,true);});
document.getElementById('progress').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;
  progMode=b.dataset.p;cycT=0;cycI=0;document.querySelectorAll('#progress button[data-p]').forEach(o=>o.classList.toggle('on',o===b));});
