<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ser IA - prototipo animado (blob + ojos + disolucion binaria)</title>
<style>
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 120% at 50% 35%,#0d1030 0%,#070610 60%,#04030a 100%);
    color:#EFEAE2;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  #cv{display:block;width:min(92vw,560px);height:min(92vw,560px);max-height:70vh;cursor:crosshair;}
  #label{font-size:19px;font-weight:700;min-height:24px;letter-spacing:.01em;}
  #chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  #chips button{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:999px;border:1px solid #3a352e;
    background:rgba(18,16,24,.55);color:#d8d2c8;cursor:pointer;transition:.15s;}
  #chips button:hover{border-color:#6a6152;} #chips button.on{color:#fff;border-color:#8a7d64;background:rgba(124,58,237,.14);}
  #note{font-size:10.5px;color:#655d50;font-family:'JetBrains Mono',monospace;text-align:center;}
</style>
</head>
<body>
<canvas id="cv" width="560" height="560"></canvas>
<div id="label">un ser</div>
<div id="chips"></div>
<div id="note">// mueve el mouse: te sigue · parpadea · respira · al transformarse se disuelve en 1s y 0s y se rearma con los ojos intactos</div>

<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=560,H=560,CX=W/2,CY=H*0.46, SZ=Math.min(W,H)*0.34;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer:coarse)').matches;
const N = coarse?1100:2200;                 // adaptativo (movil/desktop)

// ─ paleta ─
const BODY_A={h:'#7C3AED'}, BODY_B={h:'#38BDF8'};        // cuerpo frio (violeta->cian por particula)
const EYE='#FFC24D', EYE_HI='#FFF3D8';                    // ojos calidos + catchlight
function rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const cA=rgb(BODY_A.h), cB=rgb(BODY_B.h);

// ─ formas: blob base + profesiones (blob + herramienta). Se muestrean a puntos ─
function blobPath(o,S){ const cx=S/2,cy=S*0.5,w=S*0.6,h=S*0.66,t=cy-h/2,b=cy+h/2;
  o.beginPath(); o.moveTo(cx-w/2,cy+h*0.12);
  o.quadraticCurveTo(cx-w/2,t,cx,t); o.quadraticCurveTo(cx+w/2,t,cx+w/2,cy+h*0.12);
  o.quadraticCurveTo(cx+w/2,b,cx,b); o.quadraticCurveTo(cx-w/2,b,cx-w/2,cy+h*0.12); o.closePath(); }
const SHAPES={
  ser:{ tint:null, tool:null, label:'un ser', draw(o,S){ blobPath(o,S); o.fill(); } },
  medico:{ tint:'#F97066', tool:'cross', label:'Medico', draw(o,S){ blobPath(o,S); o.fill(); } },
  ingeniero:{ tint:'#A78BFA', tool:'</>', label:'Ing. de Sistemas', draw(o,S){ blobPath(o,S); o.fill(); } },
  financiero:{ tint:'#FCD34D', tool:'$', label:'Financiero', draw(o,S){ blobPath(o,S); o.fill(); } },
};
function sample(drawFn){ const S=200,oc=document.createElement('canvas');oc.width=S;oc.height=S;
  const o=oc.getContext('2d'); o.fillStyle='#fff'; drawFn(o,S);
  const d=o.getImageData(0,0,S,S).data,pts=[];
  for(let y=0;y<S;y+=2)for(let x=0;x<S;x+=2)if(d[(y*S+x)*4+3]>128)pts.push([(x/S-0.5)*2,(y/S-0.5)*2]);
  return pts; }
for(const k in SHAPES){ const pts=sample(SHAPES[k].draw),L=pts.length||1,a=new Float32Array(N*2);
  for(let i=0;i<N;i++){ const p=pts[(i*7919)%L]; a[i*2]=p[0]; a[i*2+1]=p[1]; } SHAPES[k].pos=a; }

// particulas del CUERPO (los ojos van aparte, siempre presentes)
const P=[]; for(let i=0;i<N;i++)P.push({x:CX,y:CY,c:Math.random()<.5?'0':'1',f:(Math.random()*120)|0,
  seed:Math.random(), ang:Math.random()*6.283});

let fromK='ser', toK='ser', morph=1, hold=0, auto=true, t=0;
const SEQ=['medico','ingeniero','financiero']; let seqI=0;
let gazeX=0,gazeY=0, mx=CX,my=CY;
let blinkPhase=-1, blinkTimer=0, nextBlink=2+Math.random()*3;

function setTo(from,to){ fromK=from; toK=to; morph=0; hold=0;
  document.getElementById('label').textContent=SHAPES[to].label;
  [...document.querySelectorAll('#chips button')].forEach(b=>b.classList.toggle('on',b.dataset.k===to)); }
function nextAuto(){ if(toK==='ser'){ seqI=(seqI+1)%SEQ.length; setTo('ser',SEQ[seqI]); } else setTo(toK,'ser'); }

// ── ojos: dibujados como gloms calidos, SIEMPRE presentes (ancla de identidad) ──
function drawEye(ex,ey,r,bl){
  ctx.save();
  const g=ctx.createRadialGradient(ex,ey,0,ex,ey,r*1.5);
  g.addColorStop(0,EYE_HI); g.addColorStop(0.35,EYE); g.addColorStop(1,'rgba(255,150,40,0)');
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(ex,ey,r,r*bl,0,0,6.283); ctx.fill();
  // nucleo + catchlight
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#5a3200'; ctx.beginPath(); ctx.ellipse(ex,ey,r*0.55,r*0.55*bl,0,0,6.283); ctx.fill();
  ctx.fillStyle=EYE; ctx.beginPath(); ctx.ellipse(ex,ey,r*0.42,r*0.42*bl,0,0,6.283); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex-r*0.16,ey-r*0.18*bl,r*0.16,0,6.283); ctx.fill();
  ctx.restore();
}

function drawTool(k, alpha){ const s=SHAPES[k]; if(!s||!s.tool||alpha<=0.02) return;
  ctx.save(); ctx.globalAlpha=Math.min(1,alpha); const col=s.tint||'#fff';
  const cx=CX+gazeX, cy=CY+SZ*0.34, u=SZ*0.17;
  ctx.shadowBlur=14; ctx.shadowColor=col; ctx.fillStyle=col;
  if(s.tool==='cross'){ const tt=u*0.34; ctx.fillRect(cx-tt/2,cy-u/2,tt,u); ctx.fillRect(cx-u/2,cy-tt/2,u,tt); }
  else { ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold '+(u*1.4)+'px '+(s.tool==='</>'?'"JetBrains Mono",monospace':'"Space Grotesk",sans-serif'); ctx.fillText(s.tool,cx,cy); }
  ctx.restore(); }

function frame(now){ t++;
  // respiracion (~18/min) + parpadeo + mirada
  const breath=1+ (reduce?0.012:0.028)*Math.sin(t*0.035);
  gazeX += ((mx-CX)/W*22 - gazeX)*0.06; gazeY += ((my-CY)/H*16 - gazeY)*0.06;
  blinkTimer+=1/60;
  if(blinkPhase<0 && blinkTimer>nextBlink){ blinkTimer=0; nextBlink=2.5+Math.random()*3.5; blinkPhase=0; }
  if(blinkPhase>=0){ blinkPhase+=(1/60)/0.16; if(blinkPhase>1) blinkPhase=-1; }
  const bl = blinkPhase<0 ? 1 : (0.10 + 0.90*(1-Math.sin(blinkPhase*Math.PI)));  // abierto=1 -> cerrado~0.1 -> abierto

  // demo auto
  if(!reduce && auto){ if(morph<1){} else { hold+=1/60; if(hold>1.6) nextAuto(); } }
  if(morph<1) morph=Math.min(1,morph + (1/60)/1.4);

  ctx.clearRect(0,0,W,H);
  const e=morph<0.5?2*morph*morph:1-((-2*morph+2)**2)/2;   // easeInOut
  const sc=Math.sin(Math.min(morph,1)*Math.PI);            // 0 en extremos, 1 en el medio (disolucion FUERTE)
  const A=SHAPES[fromK].pos, B=SHAPES[toK].pos;
  const tintFrom=SHAPES[fromK].tint, tintTo=SHAPES[toK].tint;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<N;i++){ const p=P[i];
    let nx=A[i*2]+(B[i*2]-A[i*2])*e, ny=A[i*2+1]+(B[i*2+1]-A[i*2+1])*e;
    // disolucion binaria fuerte: MEZCLA hacia una nube CIRCULAR acotada (radio max < lienzo),
    // nunca hacia el borde del canvas -> la zona de dibujo jamas se revela como rectangulo
    const cloudR=(0.35+p.seed*0.85)*SZ;                  // max ~1.2*SZ, dentro del lienzo
    const cx0=(nx*SZ)*breath, cy0=(ny*SZ)*breath;
    const sx=Math.cos(p.ang+t*0.004)*cloudR, sy=Math.sin(p.ang+t*0.004)*cloudR*0.85;
    let x=CX + cx0+(sx-cx0)*sc + gazeX;
    let y=CY + cy0+(sy-cy0)*sc + gazeY;
    const edgeFade = 1 - sc*0.6*((cloudR/SZ)/1.2);       // los dígitos externos se desvanecen (sin borde duro)
    // color cuerpo: violeta->cian por particula, tenido hacia la profesion
    let r=cA[0]+(cB[0]-cA[0])*p.seed, gg=cA[1]+(cB[1]-cA[1])*p.seed, b=cA[2]+(cB[2]-cA[2])*p.seed;
    const tint = e<0.5?tintFrom:tintTo;
    if(tint){ const tc=rgb(tint); const k=0.55; r=r+(tc[0]-r)*k; gg=gg+(tc[1]-gg)*k; b=b+(tc[2]-b)*k; }
    if(--p.f<0){ p.f=30+(Math.random()*110|0); p.c=Math.random()<.5?'0':'1'; }
    const tw=0.6+0.4*Math.sin(t*0.06+i);
    if(sc>0.18){ // disolviendose: DIGITOS 1/0 brillantes
      ctx.globalAlpha=Math.min(1,0.35+sc*0.9)*tw*Math.max(0,edgeFade); ctx.fillStyle='rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
      ctx.font=(9+p.seed*4)+'px "JetBrains Mono",monospace'; ctx.fillText(p.c,x,y);
    } else {      // en reposo: puntos solidos (blob)
      ctx.globalAlpha=(0.5+0.5*p.seed)*tw*Math.max(0,edgeFade); ctx.fillStyle='rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
      ctx.beginPath(); ctx.arc(x,y,1.1+p.seed*1.3,0,6.283); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // herramienta de la profesion (aparece al formarse, se desvanece al disolverse)
  drawTool(toK, (toK!=='ser') ? (1-sc)*Math.min(1,morph*1.3) : 0);

  // OJOS (siempre, encima; se mueven con respiracion+mirada, parpadean). Ancla de identidad.
  const eyeR=SZ*0.15, eyeDX=SZ*0.26, eyeY=CY - SZ*0.28*breath + gazeY*1.4;
  const eyeGX = gazeX*1.6;
  drawEye(CX-eyeDX+eyeGX, eyeY, eyeR, Math.max(0.06,bl));
  drawEye(CX+eyeDX+eyeGX, eyeY, eyeR, Math.max(0.06,bl));

  requestAnimationFrame(frame);
}

// chips + mouse
const chips=document.getElementById('chips');
[['ser','Reposo'],['medico','Medico'],['ingeniero','Ing. Sistemas'],['financiero','Financiero']].forEach(([k,txt])=>{
  const b=document.createElement('button'); b.dataset.k=k; b.textContent=txt; chips.appendChild(b); });
const atg=document.createElement('button'); atg.textContent='⏸ auto'; atg.dataset.k='__a'; chips.appendChild(atg);
chips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.k==='__a'){ auto=!auto; atg.textContent=(auto?'⏸':'▶')+' auto'; return; }
  auto=false; atg.textContent='▶ auto'; setTo(morph<1?fromK:toK, b.dataset.k); });
function pos(ev){ const r=cv.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top; mx=cx*W/r.width; my=cy*H/r.height; }
cv.addEventListener('mousemove',pos); cv.addEventListener('touchmove',pos,{passive:true});
document.querySelector('#chips button').classList.add('on');

setTo('ser','ser'); requestAnimationFrame(frame);
</script>
</body>
</html>
