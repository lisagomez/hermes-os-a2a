# --- compartido con software/adquisicion: secret-scrubbing (chequeo base) ---

[[gate]]
regla = "sin_secretos"
runner = "estatico"
chequeo = "sin_secretos"

# --- gates de modelo: DECLARADOS pero inactivos hasta tener runner real ---
# (igual que code_review/security_review en software.toml: activarlos sin
# runner es imposible por diseño — config invalida)

[[gate]]
regla = "revision_metodologica"
runner = "modelo"
activo = false

[[gate]]
regla = "tono_de_marca"
runner = "modelo"
activo = false
