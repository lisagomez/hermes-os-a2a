# reglas/procesos.toml — reglas del Supervisor para el DEPARTAMENTO DE PROCESOS.
#
# Config VERSIONADA y diff-eable (SPEC-trio §7.4: auditables, no improvisadas).
# El reto "en software es npm build, ¿aqui que?" se resuelve gateando la
# ESTRUCTURA y las invariantes del paquete to-be (diagnostico.yaml, reporte.md,
# presupuesto.xlsx, build-spec.yaml) que el Ejecutor deja en el worktree — no
# la calidad del razonamiento (eso es gate de modelo, inactivo hasta tener
# runner). Runners en chequeos_procesos.py; SPEC en departamentos/procesos.md §5.
#
# Mismas invariantes del motor (gates.py):
# - gate activo con runner inexistente = CONFIG INVALIDA (no arranca).
# - gate que no puede correr en runtime = `no_ejecutable` → RECHAZO.

departamento = "procesos"

# --- chequeos estaticos deterministas (chequeos_procesos.py) ---

[[gate]]
regla = "estructura_diagnostico"
runner = "estatico"
chequeo = "estructura_diagnostico"

