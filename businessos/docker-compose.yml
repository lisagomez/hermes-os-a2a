name: businessos

# Hermes OS · A2A — Hermes Agent multi-vertical sobre Docker
# Patron oficial de Nous Research: UN contenedor por vertical (no multi-profile).
# Regla de oro: nunca dos gateways sobre el mismo volumen (corrompe el estado).
#
# Acceso al dashboard: SOLO por tunel SSH. No hay Caddy ni puertos publicos.
#   ssh -L 9119:localhost:9119 hermes@LA_IP   →   http://localhost:9119
#
# Antes de levantar:
#   1) mkdir -p ~/businessos/{personal,negocio,clientes}/.hermes
#   2) Corre el wizard UNA vez por vertical:
#        docker run -it --rm -v ~/businessos/personal/.hermes:/opt/data nousresearch/hermes-agent:v2026.6.19 setup
#        docker run -it --rm -v ~/businessos/negocio/.hermes:/opt/data  nousresearch/hermes-agent:v2026.6.19 setup
#        docker run -it --rm -v ~/businessos/clientes/.hermes:/opt/data nousresearch/hermes-agent:v2026.6.19 setup
#      En cada wizard: elige proveedor (OpenRouter o Nous Portal), pega el token del
#      bot de Telegram correspondiente (uno por vertical), y define el modelo.
#   3) Copia tu SOUL.md y AGENTS.md a cada carpeta .hermes. En negocio, copia
#      tambien MEMORY.md (define el presupuesto mensual de tokens).
#   4) Pon tus llaves en un archivo .env junto a este compose (ver claves abajo).
#   5) docker compose up -d
#
# PROFILES (arranque escalonado, para caber en cajas chicas — CX22/CX32):
#   El 'docker compose up -d' por DEFAULT levanta SOLO el nucleo minimo:
#       hermes-negocio + grafo + grafo-db + a2abot + frontend-ci   (~4.5 GB de techo)
#   Negocio es la vertical de arranque: los dashboards apuntan a ella y lleva el
#   tracking de presupuesto. Los demas servicios estan bajo profile y se suman a
#   demanda (Compose tambien los enciende solo si otro servicio activo depende de
#   ellos):
#       docker compose --profile verticales up -d   # + personal + clientes
#       docker compose --profile trio       up -d   # + ejecutor + supervisor
#       docker compose --profile a2a        up -d   # + grafo-a2a, ventas, transcripcion, buzon
#       docker compose --profile dashboard-nativo up -d  # + dashboard 9119 (redundante con a2abot)
#   Combina: docker compose --profile verticales --profile trio up -d
#   Al bajar todo:  docker compose --profile "*" down
#
# NOTA DE RUTAS: Compose NO expande "~" en los volumenes (es feature del shell, no
# de Compose). Por eso aqui usamos ${HOME}. Define HOME o corre compose desde una
# shell de login normal (siempre lo trae).
#
# PIN DE VERSION: pineado a :v2026.6.19 (tag estable mas reciente verificado en
# Docker Hub a 2026-06-26). Revisa github.com/NousResearch/hermes-agent/releases
# para versiones nuevas. No uses ":latest"/":main" en produccion (apuntan a builds
# de minutos atras, sin garantia de estabilidad).
#
# RAM (verificado contra la doc oficial): Nous recomienda 2+ vCPU y 8 GB RAM.
# Con TRES verticales, un servidor de 2 GB se queda corto. Usa 4 GB como minimo
# realista y 8 GB (el Hetzner cx33 provisionado) si quieres holgura con el grafo
# encima. Ademas, los
# limits de abajo (3 x 2G) estan sobre-suscritos: en 4 GB solo sobreviven gracias
# al swap del paso 3 de FASE0. Si bajas a un solo box chico, reduce estos limits.
#
# PUERTOS: las verticales hablan por Telegram (conexiones salientes), NO necesitan
# puertos entrantes. Los mapeos 'ports:' van COMENTADOS para no exponer la API
# (8642). El dashboard se publica SOLO en 127.0.0.1 (accesible por tunel SSH).
#
# SUPABASE: las tres verticales registran token_usage y leen cifras desde Supabase
# (fuente de verdad, ver AGENTS.md). Pon SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY
# en .env. El service_role bypassea RLS: es una llave de SERVIDOR, nunca la
# expongas a un cliente. Llega a los contenedores via env_file (.env).

x-hermes-common: &hermes-common
  image: nousresearch/hermes-agent:v2026.6.19
  restart: unless-stopped
  command: gateway run
  shm_size: 1g
  networks: [hermes-net]

services:

  # ---------- VERTICAL: PERSONAL ----------
  hermes-personal:
    <<: *hermes-common
    container_name: hermes-personal
    profiles: ["verticales"]
    # ports:                      # cerrado: habla por Telegram, no necesita entrante
    #   - "127.0.0.1:8642:8642"
    volumes:
      - ${HOME}/businessos/personal/.hermes:/opt/data
      # Boveda Obsidian montada de lectura/escritura para captura de notas
      - ${HOME}/businessos/obsidian:/opt/data/obsidian:rw
    env_file: [.env]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_PERSONAL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G }

  # ---------- VERTICAL: NEGOCIO ----------
  hermes-negocio:
    <<: *hermes-common
    container_name: hermes-negocio
    # ports:                      # cerrado: habla por Telegram
    #   - "127.0.0.1:8643:8642"
    volumes:
      - ${HOME}/businessos/negocio/.hermes:/opt/data
    env_file: [.env]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_NEGOCIO}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G }

  # ---------- VERTICAL: CLIENTES ----------
  hermes-clientes:
    <<: *hermes-common
    container_name: hermes-clientes
    profiles: ["verticales"]
    # ports:                      # cerrado: habla por Telegram
    #   - "127.0.0.1:8644:8642"
    volumes:
      - ${HOME}/businessos/clientes/.hermes:/opt/data
    env_file: [.env]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_CLIENTES}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G }

  # ---------- DASHBOARD (Mission Control) ----------
  # La deteccion de liveness del gateway necesita PID + red compartidos con el
  # gateway que vigila. Apuntamos el dashboard al de negocio (donde vive el
  # tracking de presupuesto de tokens). Si quieres una sola vista de los tres,
  # el dashboard A2ABot consume los tres por su API y lee Supabase.
  #
  # ATENCION (riesgo de corrupcion): la doc oficial advierte que NUNCA dos
  # contenedores deben escribir el mismo volumen .hermes a la vez (corrompe
  # sesiones y memoria). El dashboard monta el volumen de negocio en modo SOLO
  # LECTURA (:ro) para mitigarlo. Si el dashboard necesitara escribir y diera
  # error, la alternativa correcta es usar el dashboard de A2ABot (que lee via
  # API + Supabase, sin tocar el volumen) en vez de este.
  #
  # ACCESO: publicado SOLO en 127.0.0.1. Desde tu maquina:
  #   ssh -L 9119:localhost:9119 hermes@LA_IP   →   http://localhost:9119
  # El '--host 0.0.0.0' es para que escuche dentro del contenedor; el binding
  # 127.0.0.1 del host es lo que impide que se vea desde internet.
  dashboard:
    image: nousresearch/hermes-agent:v2026.6.19
    container_name: hermes-dashboard
    profiles: ["dashboard-nativo"]
    restart: unless-stopped
    command: dashboard --host 0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HOME}/businessos/negocio/.hermes:/opt/data:ro
    environment:
      - GATEWAY_HEALTH_URL=http://hermes-negocio:8642
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASH_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASH_PASS}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASH_SECRET}
    depends_on: [hermes-negocio]
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ---------- A2ABOT (Mission Control, Fase 4) ----------
  # Panel unico de SOLO LECTURA: Pantheon (health de gateways via :8642 +
  # snapshot de snapshot-pantheon.py), AI Spend (v_presupuesto_mensual) y Grafo
  # (GET /evaluaciones + salud-conocimiento). NUNCA monta volumenes .hermes:
  # convive con hermes-dashboard (9119, vista nativa de UNA vertical) y es la
  # vista de las tres; si hay que ahorrar RAM, el prescindible es el 9119.
  # Acceso: ssh -L 9200:localhost:9200 hermes@LA_IP  ->  http://localhost:9200
  a2abot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: a2abot
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:3000"     # solo tunel SSH; nunca 0.0.0.0
    environment:
      - DASHBOARD_DATA=real
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GRAFO_URL=http://grafo:3000
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ---------- GRAFO (cerebro regulatorio fiscal, Fase 2) ----------
  # Evalua deducibilidad con fuente citada. Las verticales lo consultan DENTRO
  # de la red como http://grafo:3000 (los agentes no necesitan secretos para
  # leerlo). Los host-jobs (evaluar-facturas.py) entran por 127.0.0.1:3000.
  # NO tiene puerto publico: mismo postura que el dashboard (tunel SSH si hace
  # falta inspeccionarlo desde fuera del servidor).
  grafo:
    build: ./grafo
    container_name: grafo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"     # solo host-jobs locales; nunca 0.0.0.0
    environment:
      - GRAFO_DATABASE_URL=postgresql://grafo:${GRAFO_DB_PASSWORD}@grafo-db:5432/grafo
    depends_on:
      grafo-db:
        condition: service_healthy
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ---------- GRAFO-A2A (el grafo como agente A2A, Fase 5) ----------
  # Puente determinista (sin LLM, cero tokens por consulta): Agent Card en
  # /.well-known/agent-card.json y message/send que puentea a POST
  # grafo:3000/evaluaciones devolviendo la evaluacion INTEGRA (disclaimer +
  # fuentes). Opacidad: desde aqui NO se alcanza nada mas del grafo.
  # Las verticales siguen usando el REST directo (http://grafo:3000); esta es
  # la puerta formal para agentes pares (propios o de terceros). Sin secretos.
  # Hoy solo hermes-net + 127.0.0.1 (tunel SSH); exponerlo a internet con auth
  # real es residual futuro y requiere ajustar GRAFO_A2A_PUBLIC_URL en .env.
  grafo-a2a:
    build: ./grafo-a2a
    container_name: grafo-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - GRAFO_URL=http://grafo:3000
      - GRAFO_A2A_PUBLIC_URL=${GRAFO_A2A_PUBLIC_URL:-http://grafo-a2a:4000}
    depends_on:
      grafo:
        condition: service_healthy
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- FLUJOS-A2A (explorador del grafo, App C paso 2) ----------
  # Proxy de LECTURA sobre el grafo para la capa visual de Mission Control
  # (paso 3, /grafo/explorador): compone /arbol (jurisdiccion→dimension→
  # reglas con vigencia y fuente), /constructor (insumos del payload de
  # POST /evaluaciones) y passthrough de /catalogos y /evaluaciones.
  # SOLO GETs hacia el grafo — jamas escribe reglas, por construccion.
  # Nota: pese al sufijo, NO habla el protocolo A2A (es REST plano; el
  # puente A2A del grafo es grafo-a2a). Puerto 5100 reservado en
  # RECOMENDACION-reuniones-headroom.md §5; nunca expuesto al navegador
  # (Mission Control lo consume server-side dentro de hermes-net).
  # Perfil a2a como su analogo grafo-a2a: no engorda el nucleo siempre-arriba.
  flujos-a2a:
    build: ./flujos-a2a
    container_name: flujos-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5100:5100"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - GRAFO_URL=http://grafo:3000
    depends_on:
      grafo:
        condition: service_healthy
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  # ---------- VENTAS-A2A (adquisicion de clientes, Fase 9) ----------
  # La puerta COMERCIAL publica del departamento de adquisicion: Agent Card
  # con fronteras negativas literales (no cierra tratos, no fija precios, no
  # firma, no envia correos) y message/send que registra el lead en Supabase
  # `leads` (escritor unico del origen 'a2a') y devuelve la oferta APROBADA
  # (estatica, versionada en oferta.py). Sin LLM: cero tokens por lead.
  # Fallo VISIBLE: con Supabase configurado, un lead que no se pudo guardar =
  # task failed reintentable, jamas perdido en silencio.
  # Expuesta a internet SOLO a traves del servicio `edge` (gate abierto
  # 2026-07-10): este contenedor sigue en hermes-net + 127.0.0.1;
  # VENTAS_PUBLIC_URL (en el .env del server) es la URL que anuncia la card.
  # Pipeline completo: departamentos/adquisicion-clientes.md
  ventas-a2a:
    build: ./ventas-a2a
    container_name: ventas-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4400:4400"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - VENTAS_PUBLIC_URL=${VENTAS_PUBLIC_URL:-http://ventas-a2a:4400}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- CHAT-WEB2 (chat de venta de la landing, Fase 11) ----------
  # Daemon del chat de la landing cliente-web2. Implementa POST /chat/stream (SSE)
  # que el frontend en Vercel llama a traves del edge Caddy (unica ruta publica del
  # daemon). NO es el agente Hermes privado: es un vendedor LLM acotado por prompt
  # (OpenRouter, modelo barato). Captura leads (origen 'web2') igual que la route
  # /api/leads del frontend. Auth Bearer OPENCLAW_GATEWAY_TOKEN (compartido con
  # Vercel; falla cerrado si no esta configurado). Solo 127.0.0.1:4500 para
  # inspeccion local; publico SOLO via edge.
  chat-web2:
    build: ./chat-web2
    container_name: chat-web2
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-google/gemini-2.5-flash-lite}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- TRANSCRIPCION-A2A (puente STT, EG.CRM Hito 3) ----------
  # Puente determinista de speech-to-text del depto adquisicion: {card, rpc,
  # /health}, SIN LLM. El audio entra por el volumen adquisicion-audio (los
  # bytes nunca viajan por JSON-RPC); la transcripcion se persiste en la tabla
  # `transcripciones` anclada al lead. Motor por STT_ENGINE (default mock;
  # el motor real es eleccion pendiente de la duena — un valor desconocido
  # impide el arranque, jamas degrada en silencio).
  transcripcion-a2a:
    build: ./transcripcion-a2a
    container_name: transcripcion-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4800:4800"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - TRANSCRIPCION_PUBLIC_URL=${TRANSCRIPCION_PUBLIC_URL:-http://transcripcion-a2a:4800}
      - STT_ENGINE=${STT_ENGINE:-mock}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - adquisicion-audio:/audio:ro   # el puente LEE audio; jamas lo escribe
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- BUZON-A2A (correo institucional operado por agentes, HERALDO-6) ----------
  # SPEC-buzon-a2a: lee hilos SANEADOS y redacta borradores que pasan 11 gates
  # deterministas; NUNCA envia. Invariante fundacional: ningun componente que
  # ejecuta un modelo tiene credenciales de correo — la entrada la trae el
  # host-job ingerir-entrantes.py y la salida es enviar-salientes.py (host),
  # ambos con las llaves fuera de este contenedor. Toda salida exige firma
  # humana (A5) en aprobaciones_salientes, fila que este servicio no puede
  # fabricar. Nunca se publica por el edge: nada de esto es publico.
  buzon-a2a:
    build: ./buzon-a2a
    container_name: buzon-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4900:4900"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - BUZON_PUBLIC_URL=${BUZON_PUBLIC_URL:-http://buzon-a2a:4900}
      # Token canario del sistema: si aparece en un saliente = intento de
      # inyeccion (gate canario_ausente). Sin valor el gate esta ROJO
      # (fail-closed): el buzon no redacta a ciegas.
      - BUZON_CANARIO=${BUZON_CANARIO}
      - BUZON_LEYENDA=${BUZON_LEYENDA:-}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- ENRIQUECIMIENTO-A2A (waterfall enrichment, App A) ----------
  # Cascada de enriquecimiento de leads por costo: rfc_offline -> DENUE (INEGI,
  # fuente publica) -> gate 69-B CFF (LEE contraparte_69b, fail-closed: sin
  # vigilancia = bloqueado; la alimenta vigilancia-69b.py) -> patron de correo
  # por dominio. Gate LFPDPPP del grafo ANTES de correr (fail-closed si el grafo
  # no responde); persona fisica bloqueada mientras el grafo diga 'dudoso'.
  # Todo intento queda en el ledger enriquecimiento_intento con su costo; JAMAS
  # escribe public.leads. Sin LLM: cero tokens por lead.
  enriquecimiento-a2a:
    build: ./enriquecimiento-a2a
    container_name: enriquecimiento-a2a
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - ENRIQUECIMIENTO_PUBLIC_URL=${ENRIQUECIMIENTO_PUBLIC_URL:-http://enriquecimiento-a2a:5000}
      - GRAFO_URL=http://grafo:3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DENUE_TOKEN=${DENUE_TOKEN:-}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  crm-canales:
    build:
      context: .              # businessos/: el Dockerfile copia guardia-presupuesto/
      dockerfile: crm-canales/Dockerfile
    container_name: crm-canales
    profiles: ["a2a"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4600:4600"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CRM_MODELO=${CRM_MODELO:-google/gemini-2.5-flash-lite}
      - CRM_TELEGRAM_WEBHOOK_SECRET=${CRM_TELEGRAM_WEBHOOK_SECRET}
      - CRM_WHATSAPP_VERIFY_TOKEN=${CRM_WHATSAPP_VERIFY_TOKEN}
      # App secret de la app de Meta: firma X-Hub-Signature-256 del webhook.
      # FAIL-CLOSED: sin el, todo POST de WhatsApp responde 503 (a proposito).
      # Por-tenant opcional: CRM_WHATSAPP_APP_SECRET__<TENANT> le gana al global.
      - CRM_WHATSAPP_APP_SECRET=${CRM_WHATSAPP_APP_SECRET:-}
      # Tokens por tenant (marca blanca): CRM_TELEGRAM_TOKEN__<TENANT> /
      # CRM_WHATSAPP_TOKEN__<TENANT>. Se agregan al .env al dar de alta el
      # tenant; sin token el saliente queda en bitacora con enviado=false.
      - CRM_TELEGRAM_TOKEN__A2A_DEMO=${CRM_TELEGRAM_TOKEN__A2A_DEMO:-}
      - CRM_WHATSAPP_TOKEN__A2A_DEMO=${CRM_WHATSAPP_TOKEN__A2A_DEMO:-}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  sup-crm:
    build: ./sup-crm
    container_name: sup-crm
    profiles: ["a2a"]
    restart: unless-stopped
    # INTERNO en hermes-net; 127.0.0.1 solo para host-jobs (expediente) e inspección.
    ports:
      - "127.0.0.1:4700:4700"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUP_MODELO=${SUP_MODELO:-google/gemini-2.5-flash-lite}
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- EDGE (proxy publico, gate de la dueña abierto 2026-07-10) ----------
  # La UNICA pieza que publica un puerto en 0.0.0.0: Caddy con TLS automatico
  # (Let's Encrypt) + rate limiting (30 req/min por IP), delante de ventas-a2a
  # y de NADA mas. Dominio temporal sslip.io para probar; con dominio real solo
  # cambia edge/Caddyfile + VENTAS_PUBLIC_URL. El 443 lo abre el Cloud Firewall
  # de Hetzner (filtra fuera de la VM, gobierna lo que Docker publica).
  edge:
    build: ./edge
    container_name: edge
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "443:443"                 # publico a proposito (unico en todo el stack)
    volumes:
      - caddy-data:/data          # certificados ACME persistentes
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ---------- EJECUTOR-A2A (trio, Fase 6) ----------
  # Recibe UNA tarea con criterios de aceptacion (via Hermes-Negocio, skill
  # trio-software), la hace en worktree/<task_id> del volumen trio-workspace
  # (nunca main) y entrega el resultado al Supervisor via A2A. Es EL escritor
  # de la tabla `tareas` (service_role via env; el agente Hermes jamas la toca).
  # Motor: mock por default (cero tokens). EJECUTOR_ENGINE=claude requiere
  # ademas el CLI de Claude Code en la imagen + ANTHROPIC_API_KEY (residual:
  # decision de la dueña, quema tokens — se registra en token_usage 'trio').
  # Modo GLM-5.2 (opt-in, ~1/6 del costo): pon ANTHROPIC_BASE_URL al endpoint
  # Anthropic-compatible de z.ai + ANTHROPIC_AUTH_TOKEN, y modelo_pref="glm-5.2"
  # en la tarea. Sin ANTHROPIC_BASE_URL, el SDK va a Anthropic como hoy (default
  # intacto). El Supervisor re-corre los gates igual → el output se verifica sea
  # cual sea el motor. El repo objetivo se monta en /repo (TRIO_REPO_HOST en .env).
  ejecutor-a2a:
    build:
      context: .
      dockerfile: ejecutor-a2a/Dockerfile
    container_name: ejecutor-a2a
    profiles: ["trio"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:4100"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - EJECUTOR_ENGINE=${EJECUTOR_ENGINE:-mock}
      # El CLI de Claude Code rehusa --dangerously-skip-permissions como root;
      # IS_SANDBOX=1 es su señal oficial para contenedores que SON el sandbox
      # (este contenedor aislado solo ve SUS mounts — mismo criterio que el
      # safe.directory '*' de la imagen).
      - IS_SANDBOX=1
      # En la imagen los .py van aplanados a /app → el default de fabric_engine
      # (parent.parent/fabrica-sc = /fabrica-sc) NO existe; el COPY la deja en
      # /app/fabrica-sc. Sin esto el ejecutor entra en crash-loop al arrancar.
      - FABRICA_SC_DIR=/app/fabrica-sc
      - EJECUTOR_PUBLIC_URL=http://ejecutor-a2a:4100
      - SUPERVISOR_URL=http://supervisor-a2a:4200
      - TRIO_REPO=/repo
      - TRIO_WORKSPACE=/workspace
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Modo GLM-5.2 (opt-in): base_url + auth-token del endpoint z.ai. Vacios ⇒ Anthropic.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - trio-workspace:/workspace
      - ${TRIO_REPO_HOST:-${HOME}/businessos/trio-repo}:/repo
    depends_on: [supervisor-a2a]
    networks: [hermes-net]
    deploy:
      resources:
        # 2G (subido de 1G, PRP-011 Fase 4): `next build`/`tsc` de los gates hacen OOM
        # (SIGABRT/V8) a 1G. El trío es serial y el server tiene 8G → hay margen.
        limits: { cpus: "1.0", memory: 2G }

  # ---------- COORDINADOR-A2A (enjambre, Fase 7) ----------
  # Servicio HERMANO del trio ("aislar, no fundir"): descompone una feature
  # grande en un DAG de sub-tareas (Planner pluggable; mock default, cero
  # tokens), las reparte al Ejecutor con fan-out acotado + corte de presupuesto
  # (leido de token_usage.task_id), integra las ramas aprobadas y pide la
  # verificacion FINAL del Supervisor sobre la rama integrada. Escribe SOLO la
  # fila PADRE de `tareas` (es_padre=true); cada Ejecutor su fila hija.
  # Planner real (COORDINADOR_PLANNER=claude) = decision de la dueña (tokens);
  # requiere ademas CLI de Claude Code en la imagen (hoy mock-only a proposito).
  coordinador-a2a:
    build:
      context: .
      dockerfile: coordinador-a2a/Dockerfile
    container_name: coordinador-a2a
    profiles: ["trio"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4300:4300"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - COORDINADOR_PLANNER=${COORDINADOR_PLANNER:-mock}
      # Ruteo por dificultad del Planner (doctrina §3.5): "mecanica=<m>,estandar=<m>,
      # delicada=<m>" (parcial ok). Vacio = apagado → herencia del padre, como siempre.
      - PLANNER_RUTEO_MODELOS=${PLANNER_RUTEO_MODELOS:-}
      # El planner real corre el CLI de Claude Code con bypassPermissions; como
      # root lo rehusa sin IS_SANDBOX=1 (mismo gotcha del ejecutor, dogfood F6).
      - IS_SANDBOX=1
      - COORDINADOR_PUBLIC_URL=http://coordinador-a2a:4300
      - EJECUTOR_URL=http://ejecutor-a2a:4100
      - SUPERVISOR_URL=http://supervisor-a2a:4200
      - TRIO_REPO=/repo
      - TRIO_WORKSPACE=/workspace
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Modo GLM-5.2 (opt-in): mismos seams que el Ejecutor. Vacios ⇒ Anthropic.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - trio-workspace:/workspace
      - ${TRIO_REPO_HOST:-${HOME}/businessos/trio-repo}:/repo
    depends_on: [ejecutor-a2a, supervisor-a2a]
    networks: [hermes-net]
    deploy:
      resources:
        # 2G (subido de 1G, PRP-011 Fase 4): la verificación final del enjambre corre gates
        # con `next build`/`tsc`, que hacen OOM a 1G. El trío es serial → margen en 8G.
        limits: { cpus: "1.0", memory: 2G }

  # ---------- SUPERVISOR-A2A (trio, Fase 6) ----------
  # Independencia FISICA del Ejecutor (proceso/contenedor/contexto): recibe el
  # RESULTADO, monta el MISMO volumen trio-workspace y re-ejecuta los gates de
  # reglas/software.toml sobre el worktree — ignora afirmaciones. Gate que no
  # puede correr = rechazo con hallazgo. Sin SDK de modelo, sin Supabase, sin
  # secretos: 100% determinista y stateless (el veredicto es su unico output).
  supervisor-a2a:
    build:
      context: .
      dockerfile: supervisor-a2a/Dockerfile
    container_name: supervisor-a2a
    profiles: ["trio"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"     # solo inspeccion local; nunca 0.0.0.0
    environment:
      - SUPERVISOR_PUBLIC_URL=http://supervisor-a2a:4200
      - TRIO_WORKSPACE=/workspace
    volumes:
      - trio-workspace:/workspace
      # El .git de un worktree es un PUNTERO a /repo/.git/worktrees/<id>: sin
      # este mount los gates estaticos (git add/diff) salen no_ejecutable =
      # rechazo aunque el codigo este bien (descubierto en el primer dogfood
      # real). rw porque _archivos_cambiados hace `git add -A` (escribe el
      # index del worktree, que vive bajo /repo). La frontera con el Ejecutor
      # es de JUICIO, no de filesystem (misma nota del volumen trio-workspace).
      - ${TRIO_REPO_HOST:-${HOME}/businessos/trio-repo}:/repo
    networks: [hermes-net]
    deploy:
      resources:
        # 2G (subido de 1G, PRP-011 Fase 4): el Supervisor corre los gates `npm run build`
        # (next build) y `typecheck` (tsc), que hacen OOM (SIGABRT/V8) a 1G → rechazo espurio.
        # Aquí ocurrió el OOM del dogfood. El trío es serial y el server tiene 8G → hay margen.
        limits: { cpus: "1.0", memory: 2G }

  # Postgres propio del grafo. El seed corre via initdb SOLO con volumen virgen:
  # reseed = docker compose down && docker volume rm businessos_grafo-db-data
  # && docker compose up -d grafo-db grafo   (ver grafo/README.md).
  grafo-db:
    image: postgres:16-alpine
    container_name: grafo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=grafo
      - POSTGRES_PASSWORD=${GRAFO_DB_PASSWORD}
      - POSTGRES_DB=grafo
    volumes:
      - grafo-db-data:/var/lib/postgresql/data
      # initdb ejecuta los .sql en orden alfabetico (01-schema, 02-seed);
      # ignora .json y .py del mismo directorio.
      - ./grafo/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafo -d grafo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ---------- FRONTEND-CI (cabina de control interno del equipo) ----------
  # Superficie web del equipo (Next.js 16, business-os-new vendored). Corre en
  # modo dev (next dev --turbopack) sobre el codigo bind-monteado desde
  # ${HOME}/frontend-control-interno y lee su .env.local de ahi (Supabase real
  # A2ABot + OPENCLAW_GATEWAY_TOKEN). En hermes-net para alcanzar el daemon del
  # agente por nombre de servicio (residual: CLAUDECLAW_URL debe apuntar al
  # servicio que implemente /chat/stream cuando exista). Solo 127.0.0.1:3001
  # (acceso por tunel SSH); publicarla a internet con auth es decision aparte.
  frontend-ci:
    image: node:22-slim
    container_name: frontend-ci
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx next dev --turbopack -H 0.0.0.0 -p 3000"
    ports:
      - "127.0.0.1:3001:3000"     # solo inspeccion local; nunca 0.0.0.0
    volumes:
      - ${HOME}/frontend-control-interno:/app
      - frontend-ci-nm:/app/node_modules   # node_modules aislado del bind mount
    networks: [hermes-net]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

networks:
  hermes-net:
    driver: bridge

volumes:
  # node_modules de la cabina control-interno, aislado del bind mount del codigo.
  frontend-ci-nm:
  grafo-db-data:
  # Volumen compartido del trio: el Ejecutor crea worktree/<task_id> y el
  # Supervisor re-ejecuta los gates ahi mismo. La frontera entre ambos es de
  # JUICIO (contexto/proceso separados), no de filesystem.
  trio-workspace:
  # Certificados TLS del edge (ACME): persistir evita re-emitir en cada
  # recreate y pegarle a los rate limits de Let's Encrypt.
  caddy-data:
  # Audio de entrevistas de descubrimiento (EG.CRM Hito 3): lo deposita un
  # host-job/humano; transcripcion-a2a lo lee (ro). Privacidad: no sale del
  # perimetro del volumen.
  adquisicion-audio:
