<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Escala de espaciado y radios" name="Spacing & radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-display);padding:18px;display:flex;align-items:center}</style></head><body><div style="display:flex;gap:32px;align-items:center;width:100%">
<div style="display:flex;align-items:flex-end;gap:8px"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:4px;height:4px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:8px;height:8px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:12px;height:12px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:16px;height:16px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:24px;height:24px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:32px;height:32px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:48px;height:48px;background:var(--violet);opacity:.7;border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">48</span></div></div>
<div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:54px;height:54px;border:1px solid var(--border-3);border-radius:8px;background:var(--surface-2)"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">--radius-s</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:54px;height:54px;border:1px solid var(--border-3);border-radius:12px;background:var(--surface-2)"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">--radius-m</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:54px;height:54px;border:1px solid var(--border-3);border-radius:16px;background:var(--surface-2)"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">--radius-l</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:54px;height:54px;border:1px solid var(--border-3);border-radius:22px;background:var(--surface-2)"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">--radius-xl</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:70px;height:34px;margin-top:10px;border:1px solid var(--border-3);border-radius:999px;background:var(--surface-2)"></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:10px">pill</span></div></div></div></body></html>
