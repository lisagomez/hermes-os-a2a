[package]
name = "business-os-desktop"
version = "0.1.0"
description = "Business OS local-first desktop runtime"
authors = ["business-os-new contributors"]
edition = "2021"

[lib]
name = "business_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "business-os-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4", "serde"] }
