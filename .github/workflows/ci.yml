# Piso mecánico de CI: corre en cada PR sobre el dashboard (typecheck + lint + build + tests).
# No corre los pytest de los servicios A2A todavía: cablearlos aparte.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Los specs del dashboard corren SIN navegador (componentes puros como
      # funciones) — baratos en CI. Incluyen tests/app-registry-sync.spec.ts:
      # sin este paso, el "gate rojo" de drift del registro vendored era
      # aspiracional (#6 del ataque adversarial al PR #194).
      - name: Tests (specs sin navegador + paridad app-registry)
        run: npx playwright test

  # Capa de gobernanza (C1-C7). Hermes despliega por Vercel y por Docker, no con
  # `npm run deploy`: su ruta de deploy ES el CI, y un gate que no corre aquí no es un
  # gate — es un comando que alguien podría acordarse de correr.
  #   · verify:gobernanza — que el papel y el código sigan diciendo lo mismo
  #   · regresion         — C2 capa A: que ningún skill pierda una regla no negociable
  gobernanza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El verificador resuelve referencias contra la rama `golden-sets` (protocolo
          # ciego del corpus): sin historia completa no puede encontrarla.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar cableado de gobernanza
        run: npm run verify:gobernanza
      - name: Regresión de skills (C2 capa A)
        run: npm run regresion

  # Corpus de inyecciones del buzón agéntico — el PRIMER y ÚNICO puente a businessos/
  # en esta adopción (el resto queda como riesgo aceptado firmado, ver REGISTRO-RIESGO).
  # Existía desde el buzón, con diez familias y criterio de cero escapes, y NADIE lo corría:
  # el gate más barato y de mayor rendimiento del plan.
  #
  # ⚠️ Alcance real, para no leerlo como más de lo que es: de los 62 casos, ~22 ejercitan
  # el saneador (capa de escapes) y los ~40 restantes son "solo gate" — se valida que el
  # gate que declaran exista, pero NO se ejecutan contra él, porque los gates reciben un
  # `borrador` que el corpus no trae. Declarado en REGISTRO-RIESGO.md (2026-09-04).
  corpus-buzon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # saneado.py y politicas.py son stdlib puro: la única dependencia es el runner.
      - name: Instalar pytest
        run: pip install pytest
      - name: Corpus de inyecciones (cero escapes)
        working-directory: businessos/buzon-a2a
        run: python -m pytest tests/test_corpus.py -q -rs

  # Un PR que cambia código sustantivo debe dejar rastro en un documento vivo
  # (ROADMAP / CLAUDE.md / DECISIONES / README / memoria / BUSINESS_LOGIC).
  # Origen: 13 PRs seguidos (2026-07-30 → 08-02) dejaron el mapa de ruta congelado
  # en la Fase 13. Escapatoria explícita: etiqueta 'sin-impacto-doc' o una línea
  # 'sin-impacto-doc: <motivo>' en el cuerpo del PR.
  docs-vivos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate documentos vivos
        env:
          # Por env, nunca interpolado en el shell: el cuerpo del PR es texto ajeno.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          export CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"
          export PR_LABELS="$(printf '%s' "$LABELS_JSON" | python3 -c 'import sys,json; print("\n".join(json.load(sys.stdin)))')"
          # Con el diff, el gate CDC exige una entrada NUEVA y no solo que el archivo
          # aparezca en el cambio: una errata corregida dejaba el gate verde.
          export BITACORA_DIFF="$(git diff "$BASE_SHA"...HEAD -- .claude/gobernanza/BITACORA-CDC.md)"
          bash scripts/gate-docs-vivos.sh
