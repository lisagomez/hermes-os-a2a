# Piso mecánico de CI: corre en cada PR sobre el dashboard (typecheck + lint + build + tests).
# No corre los pytest de los servicios A2A todavía: cablearlos aparte.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Los specs del dashboard corren SIN navegador (componentes puros como
      # funciones) — baratos en CI. Incluyen tests/app-registry-sync.spec.ts:
      # sin este paso, el "gate rojo" de drift del registro vendored era
      # aspiracional (#6 del ataque adversarial al PR #194).
      - name: Tests (specs sin navegador + paridad app-registry)
        run: npx playwright test
