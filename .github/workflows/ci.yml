# Piso mecánico de CI: corre en cada PR sobre el dashboard (typecheck + lint + build + tests).
# No corre los pytest de los servicios A2A todavía: cablearlos aparte.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Los specs del dashboard corren SIN navegador (componentes puros como
      # funciones) — baratos en CI. Incluyen tests/app-registry-sync.spec.ts:
      # sin este paso, el "gate rojo" de drift del registro vendored era
      # aspiracional (#6 del ataque adversarial al PR #194).
      - name: Tests (specs sin navegador + paridad app-registry)
        run: npx playwright test

  # Capa de gobernanza (C1-C7). Hermes despliega por Vercel y por Docker, no con
  # `npm run deploy`: su ruta de deploy ES el CI, y un gate que no corre aquí no es un
  # gate — es un comando que alguien podría acordarse de correr.
  #   · verify:gobernanza — que el papel y el código sigan diciendo lo mismo
  #   · regresion         — C2 capa A: que ningún skill pierda una regla no negociable
  gobernanza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El verificador resuelve referencias contra la rama `golden-sets` (protocolo
          # ciego del corpus): sin historia completa no puede encontrarla.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar cableado de gobernanza
        run: npm run verify:gobernanza
      - name: Regresión de skills (C2 capa A)
        run: npm run regresion

  # Corpus de inyecciones del buzón agéntico — el PRIMER y ÚNICO puente a businessos/
  # en esta adopción (el resto queda como riesgo aceptado firmado, ver REGISTRO-RIESGO).
  # Existía desde el buzón, con diez familias y criterio de cero escapes, y NADIE lo corría:
  # el gate más barato y de mayor rendimiento del plan.
  #
  # ⚠️ Alcance real, para no leerlo como más de lo que es: de los 62 casos, ~22 ejercitan
  # el saneador (capa de escapes) y los ~40 restantes son "solo gate" — se valida que el
  # gate que declaran exista, pero NO se ejecutan contra él, porque los gates reciben un
  # `borrador` que el corpus no trae. Declarado en REGISTRO-RIESGO.md (2026-09-04).
  corpus-buzon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # saneado.py y politicas.py son stdlib puro: la única dependencia es el runner.
      - name: Instalar pytest
        run: pip install pytest
      - name: Corpus de inyecciones (cero escapes)
        working-directory: businessos/buzon-a2a
        run: python -m pytest tests/test_corpus.py -q -rs

  # Reglas del grafo FIJADAS al paquete de conocimiento (prp-grafo-lee-paquete.md). Congeladas
  # desde el corte 97d9f9e (2026-09-27); desde 2026-09-28 reglas.json y 02-seed.sql se GENERAN del
  # recorte vendorizado en seed/paquete/, que fija PIN.json. Sembrar aquí una regla crearía una
  # segunda fuente que se desvía de la única (PRP-005, monorepo privado de la fábrica).
  # Conserva el nombre `grafo-congelado` porque es check OBLIGATORIO de master (decisión 3 de la
  # Fase 0): renombrarlo exigiría tocar la protección en el mismo paso.
  # Hace falta como job propio porque este CI no corre los pytest del grafo (ver cabecera): una
  # prueba sola no dispararía. Sin dependencias: sha256sum y python3 vienen en el runner.
  grafo-congelado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Las reglas del grafo no cambian a mano (huellas)
        run: |
          # La huella debe cubrir los DOS archivos: borrar una línea no puede soltar uno en
          # silencio (test_congelado.py lo comprueba, pero este CI no corre los pytest del grafo).
          for f in businessos/grafo/seed/reglas.json businessos/grafo/seed/02-seed.sql; do
            if ! grep -qE "^[0-9a-f]{64}  $f\$" businessos/grafo/seed/CONGELADO.sha256; then
              echo "::error::CONGELADO.sha256 ya no cubre $f. Quitar su huella lo suelta: se sube el pin con seed/actualiza_paquete.py."
              exit 1
            fi
          done
          if ! grep -v '^#' businessos/grafo/seed/CONGELADO.sha256 | sha256sum -c -; then
            echo "::error::reglas.json / 02-seed.sql no son los fijados. Las reglas nuevas se siembran en la fuente única (PRP-005) y aquí se sube el pin con seed/actualiza_paquete.py, que reescribe las huellas; a mano no se actualizan."
            exit 1
          fi
      - name: El seed es exactamente el generado del paquete fijado
        run: |
          # Recorte con la huella de PIN.json, y reglas.json / 02-seed.sql rehechos desde él, byte a byte.
          python3 businessos/grafo/seed/desde_paquete.py --check
          python3 businessos/grafo/seed/gen_seed_sql.py --out "$RUNNER_TEMP/02-seed.sql" > /dev/null
          if ! cmp -s "$RUNNER_TEMP/02-seed.sql" businessos/grafo/seed/02-seed.sql; then
            echo "::error::02-seed.sql no es el generado de reglas.json: se regenera con seed/actualiza_paquete.py, no a mano."
            exit 1
          fi
      - name: Subir el pin exige la firma del laboratorio
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"
          export BITACORA_DIFF="$(git diff "$BASE_SHA"...HEAD -- .claude/gobernanza/BITACORA-CDC.md)"
          bash scripts/gate-pin-grafo.sh

  # Un PR que cambia código sustantivo debe dejar rastro en un documento vivo
  # (ROADMAP / CLAUDE.md / DECISIONES / README / memoria / BUSINESS_LOGIC).
  # Origen: 13 PRs seguidos (2026-07-30 → 08-02) dejaron el mapa de ruta congelado
  # en la Fase 13. Escapatoria explícita: etiqueta 'sin-impacto-doc' o una línea
  # 'sin-impacto-doc: <motivo>' en el cuerpo del PR.
  docs-vivos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate documentos vivos
        env:
          # Por env, nunca interpolado en el shell: el cuerpo del PR es texto ajeno.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          export CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"
          export PR_LABELS="$(printf '%s' "$LABELS_JSON" | python3 -c 'import sys,json; print("\n".join(json.load(sys.stdin)))')"
          # Con el diff, el gate CDC exige una entrada NUEVA y no solo que el archivo
          # aparezca en el cambio: una errata corregida dejaba el gate verde.
          export BITACORA_DIFF="$(git diff "$BASE_SHA"...HEAD -- .claude/gobernanza/BITACORA-CDC.md)"
          bash scripts/gate-docs-vivos.sh
